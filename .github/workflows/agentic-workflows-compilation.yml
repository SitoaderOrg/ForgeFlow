name: Agentic Workflows Compilation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.md'
  pull_request:
    paths:
      - '.github/workflows/*.md'

permissions:
  contents: write
  pull-requests: write
  issues: write
  workflows: write

jobs:
  validate-compilation:
    name: Verify & Remediate Lockfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-aw extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw || curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> $GITHUB_PATH

      - name: Recompile and validate workflows
        run: gh aw compile --validate

      - name: Check lockfile drift & create remediation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet .github/workflows/*.lock.yml; then
            echo "✅ All agentic workflow lockfiles are up to date."
            exit 0
          fi

          echo "⚠️ Agentic workflow lockfiles are out of date with their markdown source."

          # Determine target base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.head_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          FIX_BRANCH="chore/recompile-agentic-workflows-${TARGET_BRANCH//\//-}"

          # Configure git author
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to new remediation branch and commit updated lockfiles
          git checkout -B "$FIX_BRANCH"
          git add .github/workflows/*.lock.yml
          git commit -m "chore(ci): update compiled agentic workflow lockfiles"
          git push -u origin "$FIX_BRANCH" --force

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$FIX_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing remediation PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --add-reviewer "sitoader" --add-label "human-review-needed"
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          else
            PR_URL=$(gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$FIX_BRANCH" \
              --title "chore(ci): update compiled agentic workflow lockfiles" \
              --body "This PR was automatically generated because \`.github/workflows/*.lock.yml\` was out of date with its markdown source.\n\n⚠️ **Human review required before merging.**" \
              --label "human-review-needed" \
              --reviewer "sitoader")
            echo "Created remediation PR: $PR_URL"
          fi

          # Write to Actions Job Summary
          echo "### ⚠️ Workflow Compilation Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Agentic workflow lockfiles were out of date. An automated remediation PR has been created and assigned to **@sitoader** with the \`human-review-needed\` label:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Remediation PR**: $PR_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Reviewer**: @sitoader" >> $GITHUB_STEP_SUMMARY
          echo "- **Label**: \`human-review-needed\`" >> $GITHUB_STEP_SUMMARY

          exit 1
