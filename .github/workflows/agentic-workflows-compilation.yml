name: Agentic Workflows Compilation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_call:
    inputs:
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate-compilation:
    name: Verify compiled workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect workflow changes
        id: changes
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- .github/workflows; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            STATUS=$?
            if [ "$STATUS" -ne 1 ]; then exit "$STATUS"; fi
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the pinned compiler
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21
      - name: Compile and validate
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --validate --purge
      - name: Reject compilation drift
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --exit-code -- .github/workflows
          UNTRACKED=$(git ls-files --others --exclude-standard -- '.github/workflows/*.lock.yml')
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked compiled workflows: $UNTRACKED. Compile with gh-aw v0.89.21 and commit the lockfiles."
            exit 1
          fi
