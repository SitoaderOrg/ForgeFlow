name: Merge conflict check
run-name: 'Merge conflict check · ${{ github.ref_name }}'

# GitHub does not start `pull_request` workflows for a PR that conflicts with its base, so the
# Pipeline never runs and `pr-quality` would silently stay on an older commit (or
# stay green after the base moved). This check runs on every push instead:
#   - a push to the default branch can make open PRs conflict with it;
#   - a push to a PR branch can make that PR conflict.
# A conflicting PR gets `pr-quality` = failure ("Merge conflict with main") and one comment with
# the commands to resolve it. Conflicts with the base are left to the author: resolving them
# decides how the change combines with what landed on main. The resolving push starts the
# pipeline again. (Conflicts of stacked remediation PRs with a feature branch are handled by the
# remediation relay, relay.yml.)

on:
  push:
    branches: ['**']

concurrency:
  group: conflicts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  detect:
    name: Flag PRs that conflict with main
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Flag pull requests that conflict with their base
        uses: actions/github-script@v7
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // The default branch moved: every PR into it may conflict now. Otherwise: the PR of this branch.
            const pulls = (await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
              ...(branch === defaultBranch ? { base: branch } : { head: `${owner}:${branch}` })
            })).filter(p => p.base.ref === defaultBranch);

            const flagged = await quality.flagBaseConflicts({ github, context, core, pulls, sleep });
            await core.summary.addRaw(
              `### Merge conflicts after the push to \`${branch}\`\n\n` +
              `Checked ${pulls.length} PR(s) into \`${defaultBranch}\`; ` +
              (flagged.length ? `conflicting: ${flagged.map(n => `#${n}`).join(', ')}.` : 'none conflict.') + '\n'
            ).write();
