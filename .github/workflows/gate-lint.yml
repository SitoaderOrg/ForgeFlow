name: 'Gate: Lint & format'
run-name: 'Gate: Lint & format · PR #${{ inputs.pr_number }}'

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      from_pipeline:
        description: 'Called by the pipeline, which publishes the verdict itself'
        required: false
        type: boolean
        default: true
  # Re-run this gate alone; head/base refs are resolved from the PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  statuses: write

env:
  MAX_REMEDIATION_ATTEMPTS: ${{ vars.MAX_REMEDIATION_ATTEMPTS || '1' }}

jobs:
  lint:
    name: Lint & Format Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_REF: ${{ inputs.base_ref }}
        with:
          script: |
            // workflow_call passes the refs from the pipeline; workflow_dispatch passes only pr_number.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER)
            });
            if (context.eventName === 'workflow_dispatch' && context.ref !== `refs/heads/${pr.head.ref}`) {
              core.setFailed(`Dispatch ref '${context.ref}' does not match PR head branch '${pr.head.ref}'. Re-run with --ref ${pr.head.ref}.`);
              return;
            }
            core.setOutput('head_ref', process.env.HEAD_REF || pr.head.ref);
            core.setOutput('base_ref', process.env.BASE_REF || pr.base.ref);

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is required for super-linter to compute diff
          fetch-depth: 0

      - name: Prepare diff base for Super-Linter
        id: diff-base
        run: |
          # Super-Linter only knows how to diff pull_request/push events. For dispatched
          # re-runs, give it the merge-base so only the PR's changes are linted.
          MERGE_BASE=$(git merge-base "origin/${{ steps.pr.outputs.base_ref }}" HEAD)
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          echo "Linting changes between $MERGE_BASE and $(git rev-parse HEAD)"

      - name: Run Super-Linter
        id: super-linter
        uses: super-linter/super-linter/slim@12150456a73e248bdc94d0794898f94e23127c88 # v7.4.0
        env:
          DEFAULT_BRANCH: ${{ steps.pr.outputs.base_ref }}
          GITHUB_BEFORE_SHA: ${{ github.event_name != 'pull_request' && steps.diff-base.outputs.merge_base || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          MULTI_STATUS: false
          # Persist per-linter stdout/stderr so failures can be handed to the lint fixer
          SAVE_SUPER_LINTER_OUTPUT: true
          # Use the repository's own lint configs (.eslintrc.json, .prettierrc, ...) so
          # contributors and the lint fixer can reproduce results with `npm run lint`.
          LINTER_RULES_PATH: .
          JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
          # Ignore auto-generated lockfiles, docs, diagrams, and temp logs
          FILTER_REGEX_EXCLUDE: '(\.lock\.yml|wf-log\.md|docs/|\.github/|package-lock\.json)'
          # Disable noisy or non-code linters to focus on source code & logic
          VALIDATE_CHECKOV: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_MARKDOWN: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_GIT_COMMITLINT: false
          # StandardJS enforces "no semicolons", which contradicts the repository's
          # Prettier config (semi: true) and would make the lint gate impossible to pass.
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_STANDARD: false

      - name: Checkout shared scripts
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: .gate-scripts

      - name: Handle Lint Failure (Trigger Autonomous Remediation)
        if: failure() && steps.super-linter.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/remediation.cjs`);
            const prNumber = Number(process.env.PR_NUMBER);
            await helpers.addLabel({ github, context, core, prNumber, label: 'lint-failed' });

            const fs = require('fs');
            const path = require('path');
            const outDir = path.join(process.env.GITHUB_WORKSPACE, 'super-linter-output', 'super-linter');
            let details = '';
            try {
              for (const name of fs.readdirSync(outDir).filter(n => n.startsWith('super-linter-parallel-std')).sort()) {
                const text = fs.readFileSync(path.join(outDir, name), 'utf8')
                  .replace(/\x1b\[[0-9;]*m/g, '')
                  .replace(/\/github\/workspace\//g, '')
                  .trim();
                if (text && /error|✖|\[warn\]|problem/i.test(text) && !/no errors found/i.test(text)) {
                  const linter = name.replace(/^super-linter-parallel-std(out|err)-/, '');
                  details += `\n### ${linter}\n${text.slice(0, 1500)}\n`;
                }
              }
            } catch (e) {
              core.warning(`Could not read Super-Linter output: ${e.message}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = await helpers.dispatchRemediation({
              github, context, core, prNumber,
              headRef: process.env.HEAD_REF,
              workflow: 'fix-lint.lock.yml',
              stackedLabel: 'lint-remediation',
              findings: `Super-Linter failed in run ${context.runId} (${runUrl}). Fix EVERY issue below.\n${details || '(no linter output captured)'}`
            });

            const summary = '### ❌ Gate: Lint & format failed\n\n' +
              `> 🤖 **Autonomous Remediation**: Added \`lint-failed\` label. Lint fixer dispatch status: **${status}**. ` +
              'The agent opens a **Stacked Pull Request** with formatting/style fixes, which is auto-merged into your branch before the pipeline re-runs.\n';
            await core.summary.addRaw(summary).write();

      - name: Handle Lint Success (Clear Remediation Label)
        if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/remediation.cjs`);
            await helpers.removeLabel({ github, context, core, prNumber: Number(process.env.PR_NUMBER), label: 'lint-failed' });

      - name: Record gate result
        if: always() && steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          GATE_RESULT: ${{ job.status }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/pr-quality.cjs`);
            await quality.recordGate({
              github, context, core, gate: 'lint',
              prNumber: Number(process.env.PR_NUMBER),
              sha: process.env.HEAD_SHA,
              result: process.env.GATE_RESULT
            });

  # Re-checked alone after a repair: update the pr-quality verdict.
  verdict:
    name: Update pr-quality verdict
    needs: [lint]
    if: ${{ always() && !inputs.from_pipeline }}
    uses: ./.github/workflows/verdict.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      gate: lint
      gate_result: ${{ needs.lint.result }}
      sha: ${{ github.sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write
