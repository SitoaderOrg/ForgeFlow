name: 'Gate: Tests & coverage'
run-name: 'Gate: Tests & coverage · PR #${{ inputs.pr_number }}'

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      head_sha:
        required: false
        type: string
        default: ''
      from_pipeline:
        description: 'Called by the pipeline, which publishes the verdict itself'
        required: false
        type: boolean
        default: true
  # Re-run this gate alone; head/base refs are resolved from the PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  statuses: write

env:
  MAX_REMEDIATION_ATTEMPTS: ${{ vars.MAX_REMEDIATION_ATTEMPTS || '1' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '80' }}

jobs:
  test:
    name: Run Test Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          BASE_REF: ${{ inputs.base_ref }}
        with:
          script: |
            // workflow_call passes the refs from the pipeline; workflow_dispatch passes only pr_number.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER)
            });
            if (context.eventName === 'workflow_dispatch' && context.ref !== `refs/heads/${pr.head.ref}`) {
              core.setFailed(`Dispatch ref '${context.ref}' does not match PR head branch '${pr.head.ref}'. Re-run with --ref ${pr.head.ref}.`);
              return;
            }
            core.setOutput('head_ref', process.env.HEAD_REF || pr.head.ref);
            core.setOutput('base_ref', process.env.BASE_REF || pr.base.ref);

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect & Execute Tests
        id: run-tests
        run: |
          # Keep a copy of the output so failures can be handed to the tests fixer
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          COVERAGE_PASSED=true

          BASE_BRANCH="origin/${{ steps.pr.outputs.base_ref }}"

          # Every project lives in its own folder under apps/; test only the apps this PR changes.
          APPS=$(git diff --name-only "$BASE_BRANCH...HEAD" \
            | awk -F/ '$1 == "apps" && NF > 2 { print "apps/" $2 }' | sort -u \
            | while read -r d; do [ -d "$d" ] && echo "$d"; done || true)
          if [ -z "$APPS" ]; then
            echo "ℹ️ No changes under apps/. Skipping test gate cleanly."
            exit 0
          fi

          for APP in $APPS; do
            echo "📁 Testing $APP"
            pushd "$APP" >/dev/null
            TESTS_FOUND=false
            echo "🔍 Scanning $APP for test suites and coverage configuration..."

            # 1. Node.js / TypeScript (npm / yarn / pnpm)
            if [ -f "package.json" ]; then
              if grep -q '"test"' package.json; then
                TESTS_FOUND=true
                echo "📦 Detected Node.js / TypeScript project. Running tests with coverage..."
                npm ci 2>/dev/null || npm install --prefer-offline --no-audit


                # Check runner type: Vitest, Jest, or standard npm test
                if grep -q '"vitest"' package.json || [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
                  echo "⚡ Running Vitest with diff-scoped tests and ${COVERAGE_THRESHOLD}% line coverage threshold..."
                  npx vitest run --changed="$BASE_BRANCH" --coverage --coverage.thresholds.lines="$COVERAGE_THRESHOLD" || \
                  npx vitest run --coverage --coverage.thresholds.lines="$COVERAGE_THRESHOLD"
                elif grep -q '"jest"' package.json || [ -f "jest.config.js" ] || [ -f "jest.config.ts" ]; then
                  echo "🃏 Running Jest with diff-scoped tests and ${COVERAGE_THRESHOLD}% line coverage threshold..."
                  npx jest --changedSince="$BASE_BRANCH" --coverage --coverageThreshold="{\"global\":{\"lines\":${COVERAGE_THRESHOLD}}}" || \
                  npx jest --coverage --coverageThreshold="{\"global\":{\"lines\":${COVERAGE_THRESHOLD}}}"
                elif npm run | grep -q "test:cov"; then
                  echo "▶️ Running npm run test:cov..."
                  npm run test:cov
                else
                  echo "▶️ Running npm test with coverage threshold..."
                  npm test -- --coverage --coverageThreshold="{\"global\":{\"lines\":${COVERAGE_THRESHOLD}}}"
                fi
              fi
            fi

            # 2. Python (pytest with diff-scoped coverage)
            if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
              if find . -maxdepth 3 -name "*test*.py" | grep -q .; then
                TESTS_FOUND=true
                echo "🐍 Detected Python project. Checking PR diff files..."
                pip install pytest pytest-cov 2>/dev/null || true

                # Identify modified Python source files in PR diff
                CHANGED_PY_FILES=$(git diff --name-only --relative "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '\.py$' | grep -vE '(test_|tests/|_test\.py)' || true)

                if [ -n "$CHANGED_PY_FILES" ]; then
                  COV_MODULES=$(echo "$CHANGED_PY_FILES" | sed -E 's/\.py$//' | tr '/' '.' | paste -sd, -)
                  echo "⚡ Running pytest scoped to modified files (${COV_MODULES}) with ${COVERAGE_THRESHOLD}% threshold..."
                  pytest --cov="$COV_MODULES" --cov-fail-under="$COVERAGE_THRESHOLD"
                else
                  echo "▶️ No modified Python source files in diff. Running full pytest suite..."
                  pytest --cov=. --cov-fail-under="$COVERAGE_THRESHOLD" || python -m unittest discover
                fi
              fi
            fi

            # 3. Go (go test with diff-scoped coverage threshold)
            if [ -f "go.mod" ] || ls *.go 1>/dev/null 2>&1; then
              if find . -maxdepth 3 -name "*_test.go" | grep -q .; then
                TESTS_FOUND=true
                echo "🐹 Detected Go project. Running go test..."
                CHANGED_GO_PKGS=$(git diff --name-only --relative "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '\.go$' | grep -vE '_test\.go$' | xargs -n1 dirname 2>/dev/null | sort -u | sed 's|^|./|' || true)

                if [ -n "$CHANGED_GO_PKGS" ]; then
                  echo "⚡ Running go test scoped to changed packages (${CHANGED_GO_PKGS}) with ${COVERAGE_THRESHOLD}% threshold..."
                  go test -v -coverprofile=coverage.out $CHANGED_GO_PKGS
                else
                  echo "▶️ Running go test for all packages..."
                  go test -v -coverprofile=coverage.out ./...
                fi

                COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print substr($3, 1, length($3)-1)}')
                echo "Total Go coverage: ${COVERAGE}%"
                if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l 2>/dev/null || awk "BEGIN {print ($COVERAGE < $COVERAGE_THRESHOLD)}") )); then
                  echo "::error::Go test coverage is ${COVERAGE}%, which is below the required ${COVERAGE_THRESHOLD}% threshold."
                  exit 1
                fi
              fi
            fi

            # 4. Java / Kotlin (Maven / Gradle)
            if [ -f "pom.xml" ]; then
              TESTS_FOUND=true
              echo "☕ Detected Maven Java/Kotlin project. Running tests with coverage verification..."
              if [ -f "./mvnw" ]; then ./mvnw verify; else mvn verify; fi
            elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              TESTS_FOUND=true
              echo "☕ Detected Gradle Java/Kotlin project. Running tests and coverage..."
              if [ -f "./gradlew" ]; then ./gradlew test jacocoTestCoverageVerification jacocoTestReport 2>/dev/null || ./gradlew test; else gradle test jacocoTestCoverageVerification jacocoTestReport 2>/dev/null || gradle test; fi
            fi

            # 5. C# / .NET (dotnet test)
            if ls *.sln 1>/dev/null 2>&1 || ls *.csproj 1>/dev/null 2>&1; then
              TESTS_FOUND=true
              echo "🔷 Detected .NET project. Running dotnet test with coverage threshold..."
              dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.CoveragePercentTarget="$COVERAGE_THRESHOLD" 2>/dev/null || \
              dotnet test --collect:"XPlat Code Coverage"
            fi

            # 6. Rust (cargo test)
            if [ -f "Cargo.toml" ]; then
              TESTS_FOUND=true
              echo "🦀 Detected Rust project. Running cargo test..."
              cargo test
            fi

            # 7. Ruby (RSpec / Minitest)
            if [ -f "Gemfile" ]; then
              if [ -d "spec" ] || [ -d "test" ]; then
                TESTS_FOUND=true
                echo "💎 Detected Ruby project. Running tests..."
                bundle install 2>/dev/null || true
                COVERAGE_MIN="$COVERAGE_THRESHOLD" bundle exec rspec 2>/dev/null || rake test
              fi
            fi

            # 8. PHP (PHPUnit / Pest)
            if [ -f "composer.json" ]; then
              if [ -d "tests" ] || [ -f "phpunit.xml" ]; then
                TESTS_FOUND=true
                echo "🐘 Detected PHP project. Running tests..."
                composer install --prefer-dist --no-progress 2>/dev/null || true
                CHANGED_PHP_FILES=$(git diff --name-only --relative "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '\.php$' | grep -vE 'Test\.php$' || true)
                if [ -n "$CHANGED_PHP_FILES" ]; then
                  echo "⚡ Running phpunit with coverage threshold..."
                  vendor/bin/phpunit --min-covered-elements="$COVERAGE_THRESHOLD" 2>/dev/null || vendor/bin/phpunit --coverage-text 2>/dev/null || phpunit
                else
                  vendor/bin/phpunit --coverage-text 2>/dev/null || phpunit
                fi
              fi
            fi

            if [ "$TESTS_FOUND" = "false" ]; then
              echo "ℹ️ No test suite or test manifests detected for $APP. Skipping it cleanly."
            fi
            popd >/dev/null
          done

      - name: Checkout shared scripts
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: .gate-scripts

      - name: Handle Test Failure (Trigger Autonomous Remediation)
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        with:
          script: |
            const fs = require('fs');
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/remediation.cjs`);
            const prNumber = Number(process.env.PR_NUMBER);
            await helpers.addLabel({ github, context, core, prNumber, label: 'test-required' });

            let output = '';
            try {
              output = fs.readFileSync(`${process.env.RUNNER_TEMP}/test-output.log`, 'utf8')
                .replace(/\x1b\[[0-9;]*m/g, '')
                .split('\n')
                .filter(l => /📁|FAIL|✗|×|AssertionError|Expected|Received|ERROR|Coverage|threshold|% Lines|Uncovered|\|/.test(l))
                .slice(-80)
                .join('\n');
            } catch (e) {
              core.warning(`Could not read test output: ${e.message}`);
            }

            const status = await helpers.dispatchRemediation({
              github, context, core, prNumber,
              headRef: process.env.HEAD_REF,
              workflow: 'fix-tests.lock.yml',
              stackedLabel: 'test-remediation',
              findings: `Tests & Coverage gate failed in run ${context.runId}.\n${output}`
            });

            const summary = '### ❌ Gate: Tests & coverage failed\n\n' +
              `> 🧪 **Autonomous Remediation**: Added \`test-required\` label. Tests fixer dispatch status: **${status}**. ` +
              'The agent opens a **Stacked Pull Request** with fixed/missing tests, which is auto-merged into your branch.\n';
            await core.summary.addRaw(summary).write();

      - name: Handle Test Success (Clear Remediation Label)
        if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const helpers = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/remediation.cjs`);
            await helpers.removeLabel({ github, context, core, prNumber: Number(process.env.PR_NUMBER), label: 'test-required' });

            let summary = '### ✅ Gate: Tests & coverage passed\n\n' +
              'All test suites executed and passed successfully.\n';
            await core.summary.addRaw(summary).write();

      - name: Record gate result
        if: always() && steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          GATE_RESULT: ${{ job.status }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/pr-quality.cjs`);
            await quality.recordGate({
              github, context, core, gate: 'tests',
              prNumber: Number(process.env.PR_NUMBER),
              sha: process.env.HEAD_SHA,
              result: process.env.GATE_RESULT
            });

  # Re-checked alone after a repair: update the pr-quality verdict.
  verdict:
    name: Update pr-quality verdict
    needs: [test]
    if: ${{ always() && !inputs.from_pipeline }}
    uses: ./.github/workflows/verdict.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      gate: tests
      gate_result: ${{ needs.test.result }}
      sha: ${{ github.sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write