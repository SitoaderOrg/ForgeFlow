name: PR Build & Doc Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-and-docs:
    name: Build Verification & Documentation Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------
      # 1. Polyglot Build & Compilation Verification
      # -------------------------------------------------------------
      - name: Verify Build & Compilation
        id: verify-build
        run: |
          echo "🔨 Checking build and compilation for project manifests..."
          BUILD_FOUND=false

          # 1. Node.js / TypeScript
          if [ -f "package.json" ]; then
            npm ci 2>/dev/null || npm install --prefer-offline --no-audit
            if grep -q '"build"' package.json; then
              BUILD_FOUND=true
              echo "📦 Building Node.js / TypeScript project..."
              npm run build
            elif [ -f "tsconfig.json" ]; then
              BUILD_FOUND=true
              echo "📦 Compiling TypeScript via tsc..."
              npx tsc --noEmit
            fi
          fi

          # 2. Go
          if [ -f "go.mod" ] || ls *.go 1>/dev/null 2>&1; then
            BUILD_FOUND=true
            echo "🐹 Building Go project..."
            go build -v ./...
          fi

          # 3. Rust
          if [ -f "Cargo.toml" ]; then
            BUILD_FOUND=true
            echo "🦀 Checking Rust project compilation..."
            cargo check
          fi

          # 4. Java / Kotlin (Maven / Gradle)
          if [ -f "pom.xml" ]; then
            BUILD_FOUND=true
            echo "☕ Compiling Maven project..."
            if [ -f "./mvnw" ]; then ./mvnw compile -q; else mvn compile -q; fi
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            BUILD_FOUND=true
            echo "☕ Compiling Gradle project..."
            if [ -f "./gradlew" ]; then ./gradlew classes -q; else gradle classes -q; fi
          fi

          # 5. C# / .NET
          if ls *.sln 1>/dev/null 2>&1 || ls *.csproj 1>/dev/null 2>&1; then
            BUILD_FOUND=true
            echo "🔷 Building .NET project..."
            dotnet build -c Release
          fi

          if [ "$BUILD_FOUND" = "false" ]; then
            echo "ℹ️ No compilation step needed for this project. Build check passed cleanly."
          else
            echo "✅ Build and compilation verification passed."
          fi

      # -------------------------------------------------------------
      # 2. Documentation Drift & Markdown Integrity Check
      # -------------------------------------------------------------
      - name: Check Documentation Drift & Integrity
        id: check-docs
        run: |
          BASE_BRANCH="origin/${{ github.base_ref || 'main' }}"
          echo "📚 Checking for documentation drift against $BASE_BRANCH..."

          # Changed source code files (excluding tests, configs, hidden files)
          CHANGED_SRC=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '\.(js|ts|jsx|tsx|py|go|rs|java|cs|php|rb)$' | grep -vE '(test|spec|__tests__|__mocks__)' || true)
          # Changed documentation files
          CHANGED_DOCS=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '(\.md$|\.markdown$|docs/|README|DOCUMENTATION)' || true)

          echo "Changed source files:"
          echo "$CHANGED_SRC"
          echo "Changed documentation files:"
          echo "$CHANGED_DOCS"

          # Detect significant additions: if substantial logic was added (>= 20 lines added across source files) without docs
          ADDED_LINES=0
          if [ -n "$CHANGED_SRC" ]; then
            ADDED_LINES=$(git diff --numstat "$BASE_BRANCH...HEAD" -- $CHANGED_SRC 2>/dev/null | awk '{s+=$1} END {print s+0}')
          fi

          echo "Added lines in source files: $ADDED_LINES"

          # Rule: If > 30 lines of source code added/modified and zero doc files touched, flag documentation drift
          if [ "$ADDED_LINES" -ge 30 ] && [ -z "$CHANGED_DOCS" ]; then
            echo "::error::Significant new functionality added (${ADDED_LINES} lines in source files) with zero documentation updates."
            echo "docs_drift=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "docs_drift=false" >> $GITHUB_OUTPUT
            echo "✅ Documentation drift check passed."
          fi

      # -------------------------------------------------------------
      # 3. Handle Failures & Autonomous Remediation Triggers
      # -------------------------------------------------------------
      - name: Handle Failure (Attach Remediation Labels)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);
            const buildStep = '${{ steps.verify-build.outcome }}';
            const docsStep = '${{ steps.check-docs.outcome }}';

            const labelsToAdd = [];

            if (buildStep === 'failure') {
              if (!existingLabels.includes('build-failed')) labelsToAdd.push('build-failed');
            }

            if (docsStep === 'failure') {
              if (!existingLabels.includes('docs-required')) labelsToAdd.push('docs-required');
            }

            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: labelsToAdd
                });
                core.info(`Applied remediation labels: ${labelsToAdd.join(', ')}`);
              } catch (e) {
                core.warning(`Failed to add labels: ${e.message}`);
              }
            }

            let summary = '### ❌ PR Build & Documentation Gatekeeper Failed\n\n';
            if (buildStep === 'failure') {
              summary += '> 🔨 **Build Failure**: Project compilation or build failed. Added `build-failed` label.\n';
            }
            if (docsStep === 'failure') {
              summary += '> 📚 **Documentation Drift**: Significant code changes detected without corresponding documentation updates. Added `docs-required` label.\n';
            }
            summary += '\nAutonomous agents will triage and propose stacked PRs for the affected areas.\n';
            await core.summary.addRaw(summary).write();
            core.setFailed('Build verification or documentation check failed.');

      - name: Handle Success (Clear Remediation Labels)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);
            const labelsToRemove = ['build-failed', 'docs-required'].filter(l => existingLabels.includes(l));

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });
                core.info(`Removed label: ${label}`);
              } catch (e) {
                core.warning(`Failed to remove label ${label}: ${e.message}`);
              }
            }

            let summary = '### ✅ PR Build & Documentation Gatekeeper Passed\n\n' +
              'Project builds cleanly and documentation requirements are satisfied.\n';
            await core.summary.addRaw(summary).write();
