name: PR Documentation Drift Gatekeeper

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      comparison_base_sha:
        description: Optional original feature base when assessing a repair PR
        type: string
        default: ''
    outputs:
      findings:
        value: ${{ jobs.verdict.outputs.findings }}
      repair_kind:
        value: docs

permissions:
  actions: read
  contents: read
  pull-requests: read
  copilot-requests: write

jobs:
  assess:
    name: Decide documentation need and sufficiency
    uses: ./.github/workflows/pr-doc-review.lock.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ inputs.head_ref }}
      head_sha: ${{ inputs.head_sha }}
      base_ref: ${{ inputs.base_ref }}
      base_sha: ${{ inputs.base_sha }}
      comparison_base_sha: ${{ inputs.comparison_base_sha }}

  verdict:
    name: Enforce the agent's revision-bound decision
    needs: assess
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.verdict.outputs.findings }}
    steps:
      - name: Download this run's assessment
        id: assessment
        if: needs.assess.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-doc-assessment-${{ inputs.head_sha }}-${{ inputs.base_sha }}
          path: ${{ runner.temp }}/doc-assessment
      - name: Validate and enforce the decision
        id: verdict
        uses: actions/github-script@v7
        env:
          ASSESS_RESULT: ${{ needs.assess.result }}
          DOWNLOAD_RESULT: ${{ steps.assessment.outcome }}
          ASSESSMENT_PATH: ${{ runner.temp }}/doc-assessment/assessment.json
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha || inputs.base_sha }}
        with:
          script: |
            core.setOutput('findings', 'Documentation assessment did not complete. Missing evidence is not a pass.');
            if (process.env.ASSESS_RESULT !== 'success' || process.env.DOWNLOAD_RESULT !== 'success') {
              throw new Error('A successful agent run and its assessment artifact are required.');
            }
            const { readFileSync } = require('node:fs');
            const assessment = JSON.parse(readFileSync(process.env.ASSESSMENT_PATH, 'utf8'));
            if (!assessment || assessment.version !== 2 ||
                assessment.pr_number !== process.env.PR_NUMBER ||
                assessment.head_sha !== process.env.HEAD_SHA || assessment.base_sha !== process.env.BASE_SHA ||
                assessment.comparison_base_sha !== process.env.COMPARISON_BASE_SHA ||
                !['not_needed', 'sufficient', 'missing', 'uncertain'].includes(assessment.decision) ||
                typeof assessment.findings !== 'string' || !assessment.findings.trim() ||
                assessment.findings.length > 6000) {
              throw new Error('Invalid or stale documentation assessment.');
            }
            core.setOutput('findings', assessment.findings);
            if (['missing', 'uncertain'].includes(assessment.decision)) {
              throw new Error(assessment.findings);
            }
            await core.summary.addRaw(`Documentation: ${assessment.decision} for ${assessment.head_sha}.\n\n${assessment.findings}`).write();
