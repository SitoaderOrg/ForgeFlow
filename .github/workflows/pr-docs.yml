name: PR Documentation Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  docs:
    name: Documentation Drift Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Documentation Drift
        id: check-docs
        run: |
          BASE_BRANCH="origin/${{ github.base_ref || 'main' }}"
          echo "📚 Checking for documentation drift against $BASE_BRANCH..."

          # Changed source code files (excluding tests, configs, hidden files)
          CHANGED_SRC=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '\.(js|ts|jsx|tsx|py|go|rs|java|cs|php|rb)$' | grep -vE '(test|spec|__tests__|__mocks__)' || true)
          # Changed documentation files
          CHANGED_DOCS=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '(\.md$|\.markdown$|docs/|README|DOCUMENTATION)' || true)

          # Check for new dependencies/manifest additions
          CHANGED_MANIFESTS=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '(package\.json|go\.mod|Cargo\.toml|pom\.xml|build\.gradle|requirements\.txt|pyproject\.toml|composer\.json)' || true)

          # Check for schema/migration additions
          CHANGED_SCHEMAS=$(git diff --name-only "$BASE_BRANCH...HEAD" 2>/dev/null | grep -E '(schema|migration|models?|entities|\.sql)' || true)

          echo "Changed source files: $CHANGED_SRC"
          echo "Changed documentation files: $CHANGED_DOCS"
          echo "Changed manifests: $CHANGED_MANIFESTS"
          echo "Changed schemas/models: $CHANGED_SCHEMAS"

          ADDED_LINES=0
          if [ -n "$CHANGED_SRC" ]; then
            ADDED_LINES=$(git diff --numstat "$BASE_BRANCH...HEAD" -- $CHANGED_SRC 2>/dev/null | awk '{s+=$1} END {print s+0}')
          fi

          echo "Added lines in source files: $ADDED_LINES"

          # Criteria for documentation requirement:
          # 1. Substantial source additions (>= 30 lines) without doc updates
          # 2. Database schema/migration additions without doc updates
          # 3. New manifest dependencies/integrations added without doc updates
          DOCS_NEEDED=false

          if [ -z "$CHANGED_DOCS" ]; then
            if [ "$ADDED_LINES" -ge 30 ]; then
              echo "::warning::Substantial new functionality added (${ADDED_LINES} lines in source files) with zero documentation updates."
              DOCS_NEEDED=true
            elif [ -n "$CHANGED_SCHEMAS" ]; then
              echo "::warning::Database schema, model, or migration changes detected with zero documentation updates."
              DOCS_NEEDED=true
            elif [ -n "$CHANGED_MANIFESTS" ]; then
              # Check if a new dependency was added in the manifest diff
              if git diff -U0 "$BASE_BRANCH...HEAD" -- $CHANGED_MANIFESTS 2>/dev/null | grep -E '^\+[ ]*["'\'']?[a-zA-Z0-9_\-\/]+["'\'']?:' | grep -v 'version' | grep -q .; then
                echo "::warning::New dependencies or integrations detected in manifest diff without documentation."
                DOCS_NEEDED=true
              fi
            fi
          fi

          if [ "$DOCS_NEEDED" = "true" ]; then
            echo "::error::Documentation drift detected. Code changes meet criteria for documentation updates."
            exit 1
          else
            echo "✅ Documentation drift check passed."
          fi

      - name: Handle Doc Drift Failure (Trigger Autonomous Remediation)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);

            if (!existingLabels.includes('docs-required')) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['docs-required']
                });
                core.info("Applied 'docs-required' label to trigger pr-doc-updater workflow.");
              } catch (e) {
                core.warning(`Failed to add docs-required label: ${e.message}`);
              }
            }

            let summary = '### ❌ PR Documentation Gatekeeper Failed\n\n' +
              '> 📚 **Documentation Drift**: Significant code changes detected without corresponding documentation updates. Added `docs-required` label. The **PR Documentation Updater** agent will analyze your changes and open a **Stacked PR** with updated documentation.\n';
            await core.summary.addRaw(summary).write();
            core.setFailed('Documentation drift detected.');

      - name: Handle Doc Success (Clear Remediation Label)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);

            if (existingLabels.includes('docs-required')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'docs-required'
                });
                core.info("Removed 'docs-required' label.");
              } catch (e) {
                core.warning(`Failed to remove docs-required label: ${e.message}`);
              }
            }

            let summary = '### ✅ PR Documentation Gatekeeper Passed\n\n' +
              'Documentation requirements are satisfied.\n';
            await core.summary.addRaw(summary).write();
