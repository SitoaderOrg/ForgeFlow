name: PR Gatekeeper

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
    outputs:
      findings:
        description: Metadata validation findings, limited to 6000 characters.
        value: ${{ jobs.gatekeeper.outputs.findings }}
      repair_kind:
        description: Fixed repair route for this gate.
        value: ${{ jobs.gatekeeper.outputs.repair_kind }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    name: Validate PR Metadata
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.findings.outputs.findings }}
      repair_kind: metadata
    steps:
      - name: Run Pre-Flight Checks
        id: validate
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER)
            });
            const errors = [];
            if (pr.head.sha !== process.env.HEAD_SHA || pr.head.ref !== process.env.HEAD_REF) {
              errors.push('PR head changed: these metadata results must not authorize a different revision.');
            }
            const branchRegex = /^([a-zA-Z0-9_\-]+[\/\-])?(feat|fix|chore|docs|test|refactor|ci|sample)[\/\-][a-zA-Z0-9_\-\.]+$/;
            if (!branchRegex.test(process.env.HEAD_REF)) {
              errors.push('Branch name must use category/description (feat, fix, chore, docs, test, refactor, ci, or sample). Branch renaming requires author intervention.');
            }
            const title = pr.title.trim();
            const body = (pr.body || '').trim();
            if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\.]+\))?:\s.+$/.test(title)) {
              errors.push('PR title must follow Conventional Commits, for example feat: summary or fix(core): summary.');
            }
            if (body.length < 20 || /todo|fill this out/i.test(body)) {
              errors.push('PR description is under 20 characters or contains placeholder text.');
            }
            core.setOutput('details', errors.join('\n') || 'Branch, title, and description passed validation.');
            if (errors.length) core.setFailed(errors.join('\n'));

      - name: Publish Metadata Findings
        id: findings
        if: always()
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_RESULT: ${{ steps.validate.outcome }}
          DETAILS: ${{ steps.validate.outputs.details }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = `Metadata (${process.env.HEAD_SHA}): ${process.env.CHECK_RESULT}\n${process.env.DETAILS || 'Metadata validation did not complete; inspect the API/check logs.'}`.slice(0, 6000);
          let delimiter = 'GATE_FINDINGS_EOF';
          while (text.includes(delimiter)) delimiter += '_';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `findings<<${delimiter}\n${text}\n${delimiter}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          NODE
