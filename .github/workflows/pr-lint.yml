name: PR Lint & Format Gatekeeper

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    outputs:
      findings:
        value: ${{ jobs.lint.outputs.findings }}

permissions:
  contents: read

jobs:
  lint:
    name: npm run lint
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.findings.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and lint
        id: check
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee lint.log) 2>&1
          npm ci
          npm run lint
      - name: Provide diagnostics to the repair agent
        id: findings
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const detail = fs.existsSync('lint.log') ? fs.readFileSync('lint.log', 'utf8').slice(-5500) : 'Checkout or Node setup failed; see the job log.';
            core.setOutput('findings', `npm run lint: ${process.env.RESULT}\n${detail}`);
