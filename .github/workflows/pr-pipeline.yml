name: PR Quality Pipeline

# Check -> Repair -> Recheck -> Review & merge
#   Check:   lint is auto-fixed (ESLint --fix + Prettier) first, then every gate runs in parallel
#            and records a `gate/<id>` commit status (mirrored by a `<id>-passed` label).
#   Repair:  each failing gate dispatches its gh-aw agent right away, so all agents of a round
#            work in parallel (bounded by MAX_REMEDIATION_ATTEMPTS, default 1).
#   Recheck: when an agent's stacked PR is merged, the relay (pr-stacked-merge.yml) re-checks
#            only that gate; the other gates keep their results. A gate that still fails after
#            its repair fails with an error. Once every gate is green, this pipeline runs once
#            more (force=true) to confirm all gates together on the final commit.
#   Review:  the `pr-quality` commit status gates human review; only stacked remediation PRs
#            are merged automatically. A human approves and merges the feature PR into main.

on:
  # Feature PRs target main. Stacked remediation PRs target a feature branch and are consolidated
  # by pr-stacked-merge.yml, so they must not start (approval-held) runs here.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-entry point after the lint auto-fix commit and for the final all-gates check once every
  # gate is green (pr-quality.cjs). Commits made with GITHUB_TOKEN do not raise `synchronize`
  # events, so the pipeline is re-dispatched on the PR head branch instead.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to validate (run the workflow on the PR head branch)'
        required: true
        type: string
      force:
        description: 'Re-check even if this revision already has a pr-quality verdict'
        required: false
        type: boolean
        default: false

# New pushes cancel a running check; dispatched re-checks queue behind it and are
# de-duplicated by revision instead. Bot pushes (lint auto-fix, relay merges) queue as well, so
# the run that pushed finishes and a repair re-check can carry over the previous results.
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  actions: write
  statuses: write

jobs:
  # Stage 0: Resolve PR context (works for both pull_request and workflow_dispatch)
  context:
    name: 'Stage 0: Resolve PR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      revision: ${{ steps.pr.outputs.revision }}
      skip: ${{ steps.pr.outputs.skip }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      mode: ${{ steps.pr.outputs.mode }}
      recheck_before: ${{ steps.pr.outputs.recheck_before }}
      recheck_gates: ${{ steps.pr.outputs.recheck_gates }}
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_INPUT: ${{ inputs.pr_number }}
          FORCE: ${{ inputs.force }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const prNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : Number(process.env.PR_INPUT);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: '${process.env.PR_INPUT}'`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.labels.map(l => l.name);
            const remediationLabels = ['lint-remediation', 'test-remediation', 'security-remediation', 'doc-remediation'];
            let skip = false;
            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is ${pr.state}; skipping pipeline.`);
              skip = true;
            } else if (labels.some(l => remediationLabels.includes(l))) {
              core.notice(`PR #${prNumber} is a stacked remediation PR; it is consolidated by pr-stacked-merge.yml.`);
              skip = true;
            } else if (context.eventName === 'workflow_dispatch' && context.ref !== `refs/heads/${pr.head.ref}`) {
              core.setFailed(`Dispatch ref '${context.ref}' does not match PR head branch '${pr.head.ref}'. Re-run with --ref ${pr.head.ref}.`);
              return;
            }

            // The gates check out the commit this run was started for. If the branch moved since
            // (e.g. a queued dispatch), skip so no result is published for code that was not checked.
            const sameRepo = !pr.head.repo || pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const eventSha = context.eventName === 'pull_request' ? context.payload.pull_request.head?.sha : context.sha;
            if (!skip && eventSha && eventSha !== pr.head.sha) {
              skip = true;
              if (context.eventName === 'workflow_dispatch' && sameRepo) {
                core.notice(`Started for ${eventSha.slice(0, 7)} but the PR head is now ${pr.head.sha.slice(0, 7)}; re-dispatching on the new head.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'pr-pipeline.yml',
                  ref: pr.head.ref,
                  inputs: { pr_number: String(prNumber), force: process.env.FORCE === 'true' ? 'true' : 'false' }
                });
              } else {
                core.notice(`Started for ${eventSha.slice(0, 7)} but the PR head is now ${pr.head.sha.slice(0, 7)}; the newer commit is checked separately.`);
              }
            }

            const rev = quality.revision(pr);

            // Relay merges pushed with the GitHub App token raise `synchronize` themselves: re-check
            // only the repaired gates and carry the others over (see pr-stacked-merge.yml).
            let mode = skip ? 'skip' : 'full';
            let repair = null;
            if (!skip && context.eventName === 'pull_request' && context.payload.action === 'synchronize' &&
                context.payload.sender && context.payload.sender.type === 'Bot') {
              repair = await quality.repairPush({ github, context, before: context.payload.before, after: pr.head.sha });
              if (repair) {
                mode = 'recheck';
                skip = true;
                core.notice(`Relay merge into ${pr.head.ref}: re-checking ${repair.gates.join(', ') || 'stale'} gate(s), carrying the rest over from ${repair.before.slice(0, 7)}.`);
              }
            }

            // Check each revision once: skip when it already has a final verdict
            // (e.g. a relay re-dispatch racing a `pull_request` run for the same commit).
            if (!skip) {
              const forced = process.env.FORCE === 'true' || Number(process.env.GITHUB_RUN_ATTEMPT) > 1;
              const existing = await quality.getQualityStatus({ github, context, sha: pr.head.sha });
              if (!forced && existing && existing.final && existing.revision === rev) {
                core.notice(`Revision ${rev} already has a '${existing.state}' verdict (${existing.targetUrl}). Skipping duplicate check; dispatch with force=true to re-check.`);
                skip = true;
              }
            }
            if (!skip) {
              await quality.setQualityStatus({
                github, context,
                sha: pr.head.sha,
                state: 'pending',
                summary: 'Checking metadata, lint, build, tests, security and docs',
                rev,
                targetUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('revision', rev);
            core.setOutput('skip', String(skip));
            core.setOutput('same_repo', String(sameRepo));
            core.setOutput('mode', mode);
            core.setOutput('recheck_before', repair ? repair.before : '');
            core.setOutput('recheck_gates', repair ? repair.gates.join(',') : '');
            core.info(`PR #${prNumber}: ${pr.head.ref} (${pr.head.sha}) -> ${pr.base.ref}, revision ${rev}`);

  # Stage 1: Deterministic lint auto-fix (~1m). ESLint --fix and Prettier repair most lint
  # findings in seconds, so the PR Lint Fixer agent is only needed for what is left. A fix is
  # pushed to the PR branch with the GitHub App token (PR_BOT_CLIENT_ID / PR_BOT_PRIVATE_KEY), whose
  # `synchronize` event starts the check of the new commit; without the App, the push uses
  # GITHUB_TOKEN and the pipeline is re-dispatched instead. Otherwise every gate is marked pending
  # on the head commit and the gates start.
  autofix:
    name: 'Stage 1: Lint auto-fix'
    needs: [context]
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    outputs:
      pushed: ${{ steps.fix.outputs.pushed }}
    steps:
      - name: Mint GitHub App token
        id: app
        if: needs.context.outputs.same_repo == 'true' && vars.PR_BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout PR branch
        # Fork PRs (also when dispatched) cannot be pushed to.
        if: needs.context.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Auto-fix lint & formatting in changed files
        id: fix
        if: needs.context.outputs.same_repo == 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ needs.context.outputs.base_ref }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if git log -1 --format=%B | grep -qF '[pr-autofix]'; then
            echo "Head is already an auto-fix commit; not fixing again."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "Branch moved since the pipeline started; a newer run checks it."
            exit 0
          fi
          if [ ! -f package.json ] || ! grep -q '"lint:fix"' package.json; then
            echo "No lint:fix script; nothing to auto-fix."
            exit 0
          fi
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          mapfile -t FILES < <(git diff --name-only --diff-filter=d "$MERGE_BASE" HEAD \
            | grep -E '\.(js|jsx|mjs|cjs|ts|tsx|json|css|scss|html)$' \
            | grep -vE '^(\.github|docs|node_modules|dist|coverage)/|(^|/)package-lock\.json$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No lintable files changed."
            exit 0
          fi
          npm ci --no-audit --no-fund
          mapfile -t JS < <(printf '%s\n' "${FILES[@]}" | grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' || true)
          if [ ${#JS[@]} -gt 0 ]; then npx eslint --fix "${JS[@]}" || true; fi
          npx prettier --write --ignore-unknown "${FILES[@]}" || true
          if git diff --quiet; then
            echo "Nothing to auto-fix."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'style: auto-fix lint and formatting [pr-autofix]'
          git push origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --format='%h %s' HEAD

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: .gate-scripts

      - name: Re-check the auto-fixed commit or start the gates
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          PUSHED: ${{ steps.fix.outputs.pushed }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
          # The App push only starts a run when the PR targets a branch `on.pull_request` listens to.
          APP_PUSH: ${{ steps.app.outputs.token != '' && needs.context.outputs.base_ref == 'main' }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/pr-quality.cjs`);
            const prNumber = Number(process.env.PR_NUMBER);
            if (process.env.PUSHED === 'true') {
              const appPush = process.env.APP_PUSH === 'true';
              if (!appPush) {
                // GITHUB_TOKEN pushes only create approval-held runs: re-dispatch on the new commit.
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'pr-pipeline.yml',
                  ref: process.env.HEAD_REF,
                  inputs: { pr_number: String(prNumber) }
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `### 🧹 Lint & formatting auto-fixed\n\nESLint \`--fix\` and Prettier were applied to the files changed in this PR ` +
                  `(commit ${process.env.FIX_SHA.slice(0, 7)}). The quality gates now run on that commit.`
              });
              const next = appPush ? 'Its push starts the pipeline on the fixed commit.' : 'The pipeline was re-dispatched on the fixed commit.';
              await core.summary.addRaw(`### 🧹 Auto-fixed lint in ${process.env.FIX_SHA}\n\n${next}\n`).write();
              return;
            }
            await quality.startGates({ github, context, core, prNumber, sha: process.env.HEAD_SHA });

  # Stage 2: every gate runs in parallel, so all failures (and their repair agents) start in
  # the first round. Each gate records a `gate/<id>` status and dispatches its own agent.
  gatekeeper:
    name: 'Stage 2: Metadata'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-gatekeeper.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  lint:
    name: 'Stage 2: Linters'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-lint.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  build:
    name: 'Stage 2: Build'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-build.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  test:
    name: 'Stage 2: Tests & Coverage'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-test.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  security:
    name: 'Stage 2: Security & CodeQL'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-security.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      security-events: write
      statuses: write

  docs:
    name: 'Stage 2: Documentation Drift'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    uses: ./.github/workflows/pr-docs.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  # Stage 3: Verdict. Derived from the gate statuses of the head commit: pending while agents
  # repair, failure when a gate stays red, success only when every gate passed on this commit.
  # On success it dispatches pr-review-dispatcher.yml (Copilot review + human hand-off).
  verdict:
    name: 'PR Quality Verdict'
    needs: [context, autofix, gatekeeper, lint, build, test, security, docs]
    if: always() && !cancelled() && needs.context.result == 'success' && needs.context.outputs.skip != 'true' && needs.autofix.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-quality-verdict-${{ needs.context.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Publish pr-quality status
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const needs = JSON.parse(process.env.NEEDS);
            const jobs = { metadata: 'gatekeeper', lint: 'lint', build: 'build', tests: 'test', security: 'security', docs: 'docs' };
            const results = {};
            for (const [gate, job] of Object.entries(jobs)) results[gate] = needs[job] ? needs[job].result : 'skipped';

            // Agents dispatched a moment ago may not be listed yet: never post the failure comment here.
            const verdict = await quality.evaluateVerdict({
              github, context, core,
              prNumber: Number(process.env.PR_NUMBER),
              reported: { sha: process.env.HEAD_SHA, results },
              announce: false
            });
            const icon = { success: '✅', failure: '❌', pending: '⏳' }[verdict.state] || 'ℹ️';
            await core.summary.addRaw(
              `### ${icon} pr-quality: ${verdict.summary}\n\n` +
              `Revision \`${verdict.rev}\` on \`${process.env.HEAD_SHA}\`. ` +
              ({
                success: 'Ready for human review.',
                pending: 'Remediation agents are repairing the failing gates in parallel; each repaired gate is re-checked on its own.',
                failure: 'No remediation agent could repair the failing gates; manual changes are required.'
              }[verdict.state] || '') + '\n'
            ).write();
  # Repair re-check: the push consisted only of relay merges (stacked remediation PRs merged with
  # the GitHub App token). Only the repaired gates are re-checked on the new commit; the others
  # keep their result from the commit before the merge. Replaces the relay's own re-check, so a
  # repair costs exactly one pipeline run and no approval-held runs.
  recheck:
    name: 'Re-check repaired gates'
    needs: [context]
    if: needs.context.outputs.mode == 'recheck'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-quality-verdict-${{ needs.context.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Re-check repaired gates and publish pr-quality
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          BEFORE: ${{ needs.context.outputs.recheck_before }}
          GATES: ${{ needs.context.outputs.recheck_gates }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const prNumber = Number(process.env.PR_NUMBER);
            const plan = await quality.recheckGates({
              github, context, core,
              prNumber,
              branch: process.env.HEAD_REF,
              before: process.env.BEFORE,
              sha: process.env.HEAD_SHA,
              repaired: process.env.GATES.split(',').filter(Boolean),
              reason: 'stacked PR merge'
            });
            const verdict = await quality.evaluateVerdict({ github, context, core, prNumber });
            const names = (ids) => ids.map((id) => quality.GATES.find((g) => g.id === id).name).join(', ') || 'none';
            await core.summary.addRaw([
              `### 🔁 Re-checked after a stacked PR merge`,
              '',
              `- Commit: \`${process.env.HEAD_SHA}\` (results carried from \`${process.env.BEFORE.slice(0, 7)}\`)`,
              `- Re-checking: ${names(plan.recheck)}`,
              `- Carried over: ${names(plan.carried)}`,
              `- pr-quality: **${verdict.state}** — ${verdict.summary}`
            ].join('\n') + '\n').write();
