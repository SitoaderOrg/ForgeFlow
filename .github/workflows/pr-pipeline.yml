name: PR Pipeline
run-name: "${{ format('PR Pipeline · PR #{0}{1}{2}', github.event.pull_request.number || inputs.pr_number, github.event.pull_request.title && format(' · {0}', github.event.pull_request.title) || '', github.event_name == 'workflow_dispatch' && ' · re-check' || '') }}"

# Check -> Repair -> Recheck -> Review & merge
#   Check:   lint is auto-fixed (ESLint --fix + Prettier) first, proposed as a stacked PR like
#            every other automated change; then every gate runs in parallel and records a
#            `gate/<id>` commit status (mirrored by a `<id>-passed` label).
#   Repair:  each failing gate dispatches its gh-aw agent right away, so all agents of a round
#            work in parallel (bounded by MAX_REMEDIATION_ATTEMPTS, default 1).
#   Recheck: when an agent's stacked PR is merged while other gates still fail or other repairs
#            are in flight, the relay (relay.yml) re-checks only that gate; the other gates keep
#            their results. A gate that still fails after its repair fails with an error. The last
#            repair on top of passing gates (and every Copilot review fix) gets one full check of
#            all gates together instead, which is also the final check before human review.
#   Review:  the `pr-quality` commit status gates human review; only stacked remediation PRs
#            are merged automatically. A human approves and merges the feature PR into main.

on:
  # Feature PRs target main. Stacked remediation PRs target a feature branch and are consolidated
  # by relay.yml, so they must not start (approval-held) runs here.
  # Only app changes are checked: a PR whose diff touches nothing under apps/ (framework-only)
  # does not start the pipeline and gets no pr-quality status.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['apps/**']
  # Re-entry point for the final all-gates check once every gate is green (pr-quality.cjs) and
  # for manual re-checks. Commits made with GITHUB_TOKEN do not raise `synchronize` events, so
  # the pipeline is re-dispatched on the PR head branch instead.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to validate (run the workflow on the PR head branch)'
        required: true
        type: string
      force:
        description: 'Re-check even if this revision already has a pr-quality verdict'
        required: false
        type: boolean
        default: false

# New pushes cancel a running check; dispatched re-checks queue behind it and are
# de-duplicated by revision instead. Bot pushes (relay merges) queue as well, so
# the run that pushed finishes and a repair re-check can carry over the previous results.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  actions: write
  statuses: write

jobs:
  # Stage 0: Resolve PR context (works for both pull_request and workflow_dispatch)
  context:
    name: 'Stage 0: Resolve PR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
      # fullCheckAfterRepair lists the agent runs still repairing the PR.
      actions: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      revision: ${{ steps.pr.outputs.revision }}
      skip: ${{ steps.pr.outputs.skip }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      mode: ${{ steps.pr.outputs.mode }}
      recheck_before: ${{ steps.pr.outputs.recheck_before }}
      recheck_gates: ${{ steps.pr.outputs.recheck_gates }}
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_INPUT: ${{ inputs.pr_number }}
          FORCE: ${{ inputs.force }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const prNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : Number(process.env.PR_INPUT);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: '${process.env.PR_INPUT}'`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.labels.map(l => l.name);
            const remediationLabels = ['lint-remediation', 'test-remediation', 'security-remediation', 'doc-remediation', 'review-remediation'];
            let skip = false;
            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is ${pr.state}; skipping pipeline.`);
              skip = true;
            } else if (labels.some(l => remediationLabels.includes(l))) {
              core.notice(`PR #${prNumber} is a stacked remediation PR; it is consolidated by relay.yml.`);
              skip = true;
            } else if (context.eventName === 'workflow_dispatch' && context.ref !== `refs/heads/${pr.head.ref}`) {
              core.setFailed(`Dispatch ref '${context.ref}' does not match PR head branch '${pr.head.ref}'. Re-run with --ref ${pr.head.ref}.`);
              return;
            }

            // The gates check out the commit this run was started for. If the branch moved since
            // (e.g. a queued dispatch), skip so no result is published for code that was not checked.
            const sameRepo = !pr.head.repo || pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const eventSha = context.eventName === 'pull_request' ? context.payload.pull_request.head?.sha : context.sha;
            if (!skip && eventSha && eventSha !== pr.head.sha) {
              skip = true;
              if (context.eventName === 'workflow_dispatch' && sameRepo) {
                core.notice(`Started for ${eventSha.slice(0, 7)} but the PR head is now ${pr.head.sha.slice(0, 7)}; re-dispatching on the new head.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'pr-pipeline.yml',
                  ref: pr.head.ref,
                  inputs: { pr_number: String(prNumber), force: process.env.FORCE === 'true' ? 'true' : 'false' }
                });
              } else {
                core.notice(`Started for ${eventSha.slice(0, 7)} but the PR head is now ${pr.head.sha.slice(0, 7)}; the newer commit is checked separately.`);
              }
            }

            const rev = quality.revision(pr);

            // `pull_request` runs never start for a PR that conflicts with its base, but dispatched
            // runs (final check, manual re-checks) do: checking code that cannot merge is wasted.
            let mode = skip ? 'skip' : 'full';
            if (!skip && pr.mergeable === false) {
              await quality.failBaseConflict({ github, context, core, pr, rev });
              skip = true;
              mode = 'conflict';
            }

            // Relay merges pushed with the GitHub App token raise `synchronize` themselves: re-check
            // only the repaired gates and carry the others over (see relay.yml). The last repair on
            // top of passing gates (or a review fix, which touches every gate) gets the full check
            // instead: carried results would only start the final all-gates check right after.
            let repair = null;
            if (!skip && context.eventName === 'pull_request' && context.payload.action === 'synchronize' &&
                context.payload.sender && context.payload.sender.type === 'Bot') {
              repair = await quality.repairPush({ github, context, before: context.payload.before, after: pr.head.sha });
              if (repair && await quality.fullCheckAfterRepair({
                github, context, branch: pr.head.ref, before: repair.before, sha: pr.head.sha, repaired: repair.gates
              })) {
                core.notice(`Relay merge into ${pr.head.ref} repaired ${repair.gates.join(', ')} and nothing else is repairing it: checking every gate together.`);
                repair = null;
              }
              if (repair) {
                mode = 'recheck';
                skip = true;
                core.notice(`Relay merge into ${pr.head.ref}: re-checking ${repair.gates.join(', ') || 'stale'} gate(s), carrying the rest over from ${repair.before.slice(0, 7)}.`);
              }
            }

            // Check each revision once: skip when it already has a final verdict
            // (e.g. a relay re-dispatch racing a `pull_request` run for the same commit).
            if (!skip) {
              const forced = process.env.FORCE === 'true' || Number(process.env.GITHUB_RUN_ATTEMPT) > 1;
              const existing = await quality.getQualityStatus({ github, context, sha: pr.head.sha });
              if (!forced && existing && existing.final && existing.revision === rev && !quality.isBaseConflict(existing)) {
                core.notice(`Revision ${rev} already has a '${existing.state}' verdict (${existing.targetUrl}). Skipping duplicate check; dispatch with force=true to re-check.`);
                skip = true;
              }
            }
            if (!skip) {
              await quality.setQualityStatus({
                github, context,
                sha: pr.head.sha,
                state: 'pending',
                summary: 'Checking metadata, lint, build, tests, security and docs',
                rev,
                targetUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('revision', rev);
            core.setOutput('skip', String(skip));
            core.setOutput('same_repo', String(sameRepo));
            core.setOutput('mode', mode);
            core.setOutput('recheck_before', repair ? repair.before : '');
            core.setOutput('recheck_gates', repair ? repair.gates.join(',') : '');
            core.info(`PR #${prNumber}: ${pr.head.ref} (${pr.head.sha}) -> ${pr.base.ref}, revision ${rev}`);

  # Stage 1: Deterministic lint auto-fix (~1m). ESLint --fix and Prettier repair most lint
  # findings in seconds, so the lint fixer is only needed for what is left. Like every
  # automated change, a fix never lands on the feature branch directly: it is committed to
  # `lint-autofix/pr-<number>`, proposed as a stacked PR (`lint-remediation`) and handed off to the
  # remediation relay, which squash-merges it. The merge starts the full check of the fixed commit
  # (with the GitHub App token its `synchronize` event does; without it, the relay re-checks the
  # gates itself). Otherwise every gate is marked pending on the head commit and the gates start.
  autofix:
    name: 'Stage 1: Lint auto-fix'
    needs: [context]
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    outputs:
      stacked: ${{ steps.fix.outputs.stacked }}
    steps:
      - name: Checkout PR branch
        # A stacked PR cannot target a fork's branch (also when dispatched).
        if: needs.context.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_ref }}
          fetch-depth: 0

      - name: Auto-fix lint & formatting in changed files
        id: fix
        if: needs.context.outputs.same_repo == 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ needs.context.outputs.base_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          FIX_BRANCH: lint-autofix/pr-${{ needs.context.outputs.pr_number }}
        run: |
          echo "stacked=false" >> "$GITHUB_OUTPUT"
          if git log -1 --format=%B | grep -qF '[pr-autofix]'; then
            echo "Head is already a merged auto-fix; not fixing again."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "Branch moved since the pipeline started; a newer run checks it."
            exit 0
          fi
          if [ ! -f package.json ] || ! grep -q '"lint:fix"' package.json; then
            echo "No lint:fix script; nothing to auto-fix."
            exit 0
          fi
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          mapfile -t FILES < <(git diff --name-only --diff-filter=d "$MERGE_BASE" HEAD \
            | grep -E '\.(js|jsx|mjs|cjs|ts|tsx|json|css|scss|html)$' \
            | grep -vE '^(\.github|docs|node_modules|dist|coverage)/|(^|/)package-lock\.json$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No lintable files changed."
            exit 0
          fi
          npm ci --no-audit --no-fund
          mapfile -t JS < <(printf '%s\n' "${FILES[@]}" | grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' || true)
          if [ ${#JS[@]} -gt 0 ]; then npx eslint --fix "${JS[@]}" || true; fi
          npx prettier --write --ignore-unknown "${FILES[@]}" || true
          if git diff --quiet; then
            echo "Nothing to auto-fix."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$FIX_BRANCH"
          git commit -am 'style(lint): auto-fix lint and formatting [pr-autofix]'
          git push --force origin "HEAD:refs/heads/$FIX_BRANCH"
          echo "stacked=true" >> "$GITHUB_OUTPUT"
          echo "branch=$FIX_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --name-only HEAD~1 HEAD | paste -sd, -)" >> "$GITHUB_OUTPUT"
          git show --stat --format='%h %s' HEAD

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: .gate-scripts

      - name: Propose the auto-fix as a stacked PR or start the gates
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          REVISION: ${{ needs.context.outputs.revision }}
          STACKED: ${{ steps.fix.outputs.stacked }}
          FIX_BRANCH: ${{ steps.fix.outputs.branch }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
          FIX_FILES: ${{ steps.fix.outputs.files }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.gate-scripts/.github/scripts/pr-quality.cjs`);
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            if (process.env.STACKED !== 'true') {
              await quality.startGates({ github, context, core, prNumber, sha: process.env.HEAD_SHA });
              return;
            }

            // Same path as the remediation agents: stacked PR -> relay squash-merge -> gates.
            const headRef = process.env.HEAD_REF;
            const branch = process.env.FIX_BRANCH;
            const files = (process.env.FIX_FILES || '').split(',').filter(Boolean);
            const [existing] = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: headRef, per_page: 10
            });
            let stacked = existing;
            // The commit the fix was built on: the relay checks it is still in the branch's history.
            const body = [
              `ESLint \`--fix\` and Prettier applied to the files changed in #${prNumber}:`,
              '',
              ...files.map((f) => `- \`${f}\``),
              '',
              'This stacked PR was automatically opened by the **PR Pipeline** lint auto-fix and will be ' +
                'automatically squashed and merged into your feature branch by `relay.yml`.',
              '',
              quality.stackedBaseMarker(process.env.HEAD_SHA)
            ].join('\n');
            if (!stacked) {
              ({ data: stacked } = await github.rest.pulls.create({
                owner, repo,
                head: branch,
                base: headRef,
                title: 'style(lint): auto-fix lint and formatting [pr-autofix]',
                body
              }));
            } else {
              await github.rest.pulls.update({ owner, repo, pull_number: stacked.number, body });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: stacked.number, labels: ['lint-remediation'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `### 🧹 Lint & formatting auto-fix proposed\n\nESLint \`--fix\` and Prettier fixed ${files.length} file(s) ` +
                `changed in this PR. The stacked PR #${stacked.number} will be auto-merged into \`${headRef}\`, ` +
                'and the quality gates then run on the fixed commit.'
            });
            await quality.setQualityStatus({
              github, context,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              summary: `Repairing: Lint (auto-fix stacked PR #${stacked.number})`,
              rev: process.env.REVISION,
              targetUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
            const defaultBranch = (context.payload.repository && context.payload.repository.default_branch) || 'main';
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'relay.yml',
              ref: defaultBranch,
              inputs: { branch: headRef, agent_result: 'success', source: `Lint auto-fix (run ${context.runId})` }
            });
            await core.summary.addRaw(
              `### 🧹 Lint auto-fix proposed as stacked PR #${stacked.number}\n\n` +
              `Commit ${process.env.FIX_SHA} on \`${branch}\`; the remediation relay merges it and the gates run on the fixed commit.\n`
            ).write();

  # Stage 2: every gate runs in parallel, so all failures (and their repair agents) start in
  # the first round. Each gate records a `gate/<id>` status and dispatches its own agent.
  metadata:
    name: 'Stage 2: PR metadata'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-metadata.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  lint:
    name: 'Stage 2: Lint & format'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-lint.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  build:
    name: 'Stage 2: Build'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-build.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  tests:
    name: 'Stage 2: Tests & coverage'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-tests.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  security:
    name: 'Stage 2: Security'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-security.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      security-events: write
      statuses: write

  docs:
    name: 'Stage 2: Docs drift'
    needs: [context, autofix]
    if: needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    uses: ./.github/workflows/gate-docs.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write

  # Stage 3: Verdict. Derived from the gate statuses of the head commit: pending while agents
  # repair, failure when a gate stays red, success only when every gate passed on this commit.
  # On success it dispatches review-request.yml (Copilot review + human hand-off).
  verdict:
    name: 'Stage 3: Verdict'
    needs: [context, autofix, metadata, lint, build, tests, security, docs]
    if: always() && !cancelled() && needs.context.result == 'success' && needs.context.outputs.skip != 'true' && needs.autofix.outputs.stacked != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: verdict-${{ needs.context.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Publish pr-quality status
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const needs = JSON.parse(process.env.NEEDS);
            const jobs = { metadata: 'metadata', lint: 'lint', build: 'build', tests: 'tests', security: 'security', docs: 'docs' };
            const results = {};
            for (const [gate, job] of Object.entries(jobs)) results[gate] = needs[job] ? needs[job].result : 'skipped';

            // Agents dispatched a moment ago may not be listed yet: never post the failure comment here.
            const verdict = await quality.evaluateVerdict({
              github, context, core,
              prNumber: Number(process.env.PR_NUMBER),
              reported: { sha: process.env.HEAD_SHA, results },
              announce: false
            });
            const icon = { success: '✅', failure: '❌', pending: '⏳' }[verdict.state] || 'ℹ️';
            await core.summary.addRaw(
              `### ${icon} pr-quality: ${verdict.summary}\n\n` +
              `Revision \`${verdict.rev}\` on \`${process.env.HEAD_SHA}\`. ` +
              ({
                success: 'Ready for human review.',
                pending: 'Remediation agents are repairing the failing gates in parallel; each repaired gate is re-checked on its own.',
                failure: 'No remediation agent could repair the failing gates; manual changes are required.'
              }[verdict.state] || '') + '\n'
            ).write();
  # Repair re-check: the push consisted only of relay merges (stacked remediation PRs merged with
  # the GitHub App token) while other gates still fail or other repairs are in flight. Only the
  # repaired gates are re-checked on the new commit; the others keep their result from the commit
  # before the merge. Replaces the relay's own re-check, so a repair costs exactly one pipeline run
  # and no approval-held runs.
  recheck:
    name: 'Re-check repaired gates'
    needs: [context]
    if: needs.context.outputs.mode == 'recheck'
    runs-on: ubuntu-latest
    concurrency:
      group: verdict-${{ needs.context.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Re-check repaired gates and publish pr-quality
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          BEFORE: ${{ needs.context.outputs.recheck_before }}
          GATES: ${{ needs.context.outputs.recheck_gates }}
        with:
          script: |
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const prNumber = Number(process.env.PR_NUMBER);
            const plan = await quality.recheckGates({
              github, context, core,
              prNumber,
              branch: process.env.HEAD_REF,
              before: process.env.BEFORE,
              sha: process.env.HEAD_SHA,
              repaired: process.env.GATES.split(',').filter(Boolean),
              reason: 'stacked PR merge'
            });
            const verdict = await quality.evaluateVerdict({ github, context, core, prNumber });
            const names = (ids) => ids.map((id) => quality.GATES.find((g) => g.id === id).name).join(', ') || 'none';
            await core.summary.addRaw([
              `### 🔁 Re-checked after a stacked PR merge`,
              '',
              `- Commit: \`${process.env.HEAD_SHA}\` (results carried from \`${process.env.BEFORE.slice(0, 7)}\`)`,
              `- Re-checking: ${names(plan.recheck)}`,
              `- Carried over: ${names(plan.carried)}`,
              `- pr-quality: **${verdict.state}** — ${verdict.summary}`
            ].join('\n') + '\n').write();
