          name: ${{ needs.agent.outputs.artifact_prefix }}detection
          path: |
            /tmp/gh-aw/threat-detection/detection_result.json
            /tmp/gh-aw/threat-detection/execution.json
            /tmp/gh-aw/threat-detection/detection_usage.json
            /tmp/gh-aw/threat-detection/detection_usage.jsonl
            /tmp/gh-aw/threat-detection/sandbox/firewall/logs/
            /tmp/gh-aw/threat-detection/sandbox/firewall/audit/
          if-no-files-found: ignore
      - name: Conclude threat detection
        id: detection_conclusion
        if: always()
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          THREAT_DETECT_INSTALL_OUTCOME: ${{ steps.threat_detect_install.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "false"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/conclude_threat_detection.sh" /tmp/gh-aw/threat-detection/detection_result.json

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/pr-repair"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_ENGINE_ID: "copilot"
      GH_AW_ENGINE_MODEL: "${{ vars.GH_AW_AGENT_MODEL || 'gpt-4.1' }}"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_SAFE_OUTPUT_MESSAGES: "{\"activationComments\":\"false\"}"
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "pr-repair"
      GH_AW_WORKFLOW_NAME: "PR Repair"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/pr-repair.md"
    outputs:
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_pr_number: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
      created_pr_url: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@v0.89.21
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "PR Repair"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/pr-repair.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.87"
          GH_AW_INFO_AWF_VERSION: "v0.28.23"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{${{ needs.activation.outputs.artifact_prefix }}agent,${{ needs.activation.outputs.artifact_prefix }}agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download patch artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}agent
          path: /tmp/gh-aw/
      - name: Checkout repository
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git credentials
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Validate the single scoped publication request
        run: |
          set -euo pipefail
          test -f "$AGENT_OUTPUT"
          jq -e --arg kind "$REPAIR_KIND" --arg pr "$PR_NUMBER" --arg feature_pr "$FEATURE_PR_NUMBER" \
            --arg base "$EXPECTED_HEAD_REF" --arg parent "$PARENT_URL" --arg feature "$FEATURE_URL" --arg repo "$REPOSITORY" '
            if (.errors | type == "array" and length == 0)
              and (.items | type == "array" and length == 1)
            then .items[0] else error("Exactly one publication request is required") end
            | (.repo == null or .repo == $repo)
              and if $kind == "metadata" then
                .type == "update_pull_request"
                and $pr == $feature_pr
                and (.pull_request_number | tostring) == $feature_pr
                and (has("title") or has("body"))
                and (keys - ["type","title","body","pull_request_number","operation","repo"] | length == 0)
              elif (["lint","build","test","security","docs"] | index($kind)) != null then
                .type == "create_pull_request" and .base == $base
                and (.title | type == "string" and startswith("fix(" + $kind + "): ") and length <= 128)
                and (.body | type == "string" and length > 0 and length <= 12000
                  and contains($parent) and contains($feature) and contains("## Repaired gate")
                  and contains("## Validation") and contains("## Unresolved parent failures"))
                and (.labels == null or .labels == ["automated-repair"])
                and (keys - ["type","title","body","base","branch","labels","temporary_id","repo"] | length == 0)
              else false end
          ' "$AGENT_OUTPUT" >/dev/null
        env:
          AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          EXPECTED_HEAD_REF: ${{ inputs.head_ref }}
          FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          FEATURE_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.feature_pr_number }}
          PARENT_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_KIND: ${{ inputs.repair_kind }}
          REPOSITORY: ${{ github.repository }}
      - name: Validate the exact native repair bundle and dependency-only manifest edits
        if: inputs.repair_kind != 'metadata'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          REPAIR_KIND: ${{ inputs.repair_kind }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const actions = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actions, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { resolveTransportPaths } = require(path.join(actions, 'resolve_transport_paths.cjs'));
            const item = JSON.parse(fs.readFileSync(process.env.AGENT_OUTPUT, 'utf8')).items[0];
            const { bundlePath } = resolveTransportPaths(item, process.env.GITHUB_REPOSITORY);
            if (!bundlePath || !fs.existsSync(bundlePath)) throw new Error('A native bundle is required; patch fallback is not allowed.');
            const git = async args => (await exec.getExecOutput('git', args, { silent: true })).stdout;
            await git(['bundle', 'verify', bundlePath]);
            const refs = (await git(['bundle', 'unbundle', bundlePath])).trim().split('\n').filter(Boolean);
            if (refs.length !== 1 || !/^[0-9a-f]{40} /.test(refs[0])) throw new Error('Expected one native repair bundle tip.');
            const tip = refs[0].split(' ')[0];
            const original = process.env.EXPECTED_HEAD_SHA;
            await git(['merge-base', '--is-ancestor', original, tip]);
            const files = (await git(['diff', '--name-only', '-z', original, tip])).split('\0').filter(Boolean);
            if (!files.length || files.length > 20) throw new Error('The repair must change between 1 and 20 files.');
            const protectedConfig = /(^|\/)(?:\.github|\.agents|\.copilot|\.claude)\//;
            const protectedName = /(^|\/)(?:AGENTS\.md|CLAUDE\.md|CODEOWNERS|\.env(?:\..*)?|\.eslint(?:rc(?:\..*)?|ignore)|\.prettier(?:rc(?:\..*)?|ignore)|\.htmlhintrc|(?:ts|js)config(?:\.[^/]+)?\.json|[^/]+\.config\.[^/]+)$/;
            if (files.some(file => protectedConfig.test(file) || protectedName.test(file))) throw new Error('Workflow, instruction, secret, and gate configuration files are protected.');
            if (process.env.REPAIR_KIND === 'docs' && files.some(file => !file.endsWith('.md'))) throw new Error('Documentation repairs may only change Markdown documentation.');
            const stable = value => JSON.stringify(normalize(value));
            function normalize(value) {
              if (Array.isArray(value)) return value.map(normalize);
              if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(key => [key, normalize(value[key])]));
              return value;
            }
            const dependencyFields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
            const immutable = value => Object.fromEntries(Object.entries(value).filter(([key]) => !dependencyFields.includes(key)));
            const readJson = async (ref, file) => JSON.parse(await git(['show', `${ref}:${file}`]));
            function verifyVersions(before, after, file) {
              if (stable(immutable(before)) !== stable(immutable(after))) throw new Error(`${file}: scripts, engines, package metadata, and gate settings must not change.`);
              for (const field of dependencyFields) {
                const oldVersions = before[field] || {}, newVersions = after[field] || {};
                if (stable(Object.keys(oldVersions).sort()) !== stable(Object.keys(newVersions).sort())) throw new Error(`${file}: adding or removing dependencies is not a version-only repair.`);
                for (const [name, version] of Object.entries(newVersions)) {
                  if (version !== oldVersions[name] && (typeof version !== 'string' || !/^[~^]?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version))) throw new Error(`${file}: ${name} must use a concrete registry version, optionally prefixed with ^ or ~.`);
                }
              }
            }
            for (const file of files) {
              if (/(^|\/)package\.json$/.test(file)) {
                verifyVersions(await readJson(original, file), await readJson(tip, file), file);
              }
              if (/(^|\/)package-lock\.json$/.test(file)) {
                const before = await readJson(original, file), after = await readJson(tip, file);
                const header = value => Object.fromEntries(Object.entries(value).filter(([key]) => !['packages', 'dependencies'].includes(key)));
                if (stable(header(before)) !== stable(header(after))) throw new Error(`${file}: lockfile identity and format must not change.`);
                verifyVersions(before.packages?.[''] || {}, after.packages?.[''] || {}, `${file} root package`);
              }
            }
            core.info(`Validated ${files.length} repair files against the exact parent head; no branch was pushed or modified.`);
      - name: Refuse stale feature or candidate before publishing any repair
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          EXPECTED_BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_HEAD_REF: ${{ inputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          FEATURE_BASE_REF: ${{ inputs.feature_base_ref }}
          FEATURE_BASE_SHA: ${{ inputs.feature_base_sha }}
          FEATURE_HEAD_REF: ${{ inputs.feature_head_ref }}
          FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          FEATURE_METADATA_HASH: ${{ inputs.feature_metadata_hash }}
          FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_KIND: ${{ inputs.repair_kind }}
        with:
          retries: 0
          script: |
            const assert = require('node:assert/strict');
            const { createHash } = require('node:crypto');
            const env = process.env;
            const { data: feature } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(env.FEATURE_PR_NUMBER), request: { timeout: 30000 },
            });
            const { data: candidate } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(env.PR_NUMBER), request: { timeout: 30000 },
            });
            for (const [pr, prefix, number] of [
              [feature, 'FEATURE_', env.FEATURE_PR_NUMBER],
              [candidate, 'EXPECTED_', env.PR_NUMBER],
            ]) {
              assert.equal(String(pr.number), number, 'Unexpected PR identity');
              assert.equal(pr.state, 'open', 'PR must remain open');
              for (const side of ['head', 'base']) {
                assert.equal(pr[side]?.repo?.full_name, env.GITHUB_REPOSITORY, 'PR must remain in this repository');
                assert.equal(pr[side]?.ref, env[`${prefix}${side.toUpperCase()}_REF`], 'Stale PR branch');
                assert.equal(pr[side]?.sha, env[`${prefix}${side.toUpperCase()}_SHA`], 'Stale PR commit');
              }
            }
            const metadataHash = pr => createHash('sha256').update(JSON.stringify([pr.title, pr.body || '']), 'utf8').digest('hex');
            assert.equal(metadataHash(feature), env.FEATURE_METADATA_HASH, 'Stale feature metadata');
            if (env.PR_NUMBER === env.FEATURE_PR_NUMBER) {
              assert.equal(metadataHash(candidate), env.FEATURE_METADATA_HASH, 'Feature metadata changed between snapshot reads');
            }
            assert.equal(env.COMPARISON_BASE_SHA, env.FEATURE_BASE_SHA, 'Comparison must use the original feature base');
            if (env.REPAIR_KIND === 'metadata') {
              assert.equal(env.PR_NUMBER, env.FEATURE_PR_NUMBER, 'Metadata repairs may only target the original feature PR');
              for (const field of ['HEAD_REF', 'HEAD_SHA', 'BASE_REF', 'BASE_SHA']) {
                assert.equal(env[`EXPECTED_${field}`], env[`FEATURE_${field}`], 'Metadata requires the original feature snapshot');
              }
            }
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "api.npms.io,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,bun.sh,cdn.jsdelivr.net,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,deb.nodesource.com,deno.land,esm.sh,get.pnpm.io,googleapis.deno.dev,googlechromelabs.github.io,json-schema.org,json.schemastore.org,jsr.io,keyserver.ubuntu.com,nodejs.org,npm.pkg.github.com,npmjs.com,npmjs.org,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,ppa.launchpad.net,registry.bower.io,registry.npmjs.com,registry.npmjs.org,registry.yarnpkg.com,repo.yarnpkg.com,s.symcb.com,s.symcd.com,security.ubuntu.com,skimdb.npmjs.com,storage.googleapis.com,telemetry.vercel.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com,www.npmjs.com,www.npmjs.org,yarnpkg.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_pull_request\":{\"allow_empty\":false,\"allowed_base_branches\":\"${{ inputs.head_ref }}\",\"allowed_files\":[\"apps/**\",\"tests/**\",\"docs/**/*.md\",\"readme.md\",\"README.md\",\"package.json\",\"package-lock.json\"],\"auto_close_issue\":false,\"auto_merge\":false,\"base_branch\":\"${{ inputs.head_ref }}\",\"body_footer\":\"## Repair provenance\\nOriginal feature PR: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.feature_pr_number }}\\nCandidate tip / parent PR: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}\\nSelected gate: `${{ inputs.repair_kind }}`\\nCurrent feature trunk head: `${{ inputs.feature_head_sha }}` on `${{ inputs.feature_head_ref }}`\\nFeature base: `${{ inputs.feature_base_sha }}` on `${{ inputs.feature_base_ref }}`\\nFeature metadata hash: `${{ inputs.feature_metadata_hash }}`\\nCandidate head: `${{ inputs.head_sha }}` on `${{ inputs.head_ref }}`\\nCandidate immediate base: `${{ inputs.base_sha }}` on `${{ inputs.base_ref }}`\\nFull comparison base: `${{ inputs.comparison_base_sha }}`\\nRun: {run_url}\\nThis repair targets the current candidate head branch.\\nThe automated-repair label is informational, not authorization.\\nOnly the controller registers and lands repair-only native stacks with the\\nfeature branch as trunk. The feature PR targeting the default branch stays outside.\\nEvery automated file change, including lint fixes, is published through a\\nseparate scoped repair PR, never a direct gate edit or push to the feature.\\nThe controller owns auditable merge comments linking the repair and feature PRs.\\n\",\"branch_prefix\":\"aw-repair-pr-${{ inputs.feature_pr_number }}-after-${{ inputs.pr_number }}-${{ inputs.repair_kind }}-\",\"close_older_pull_requests\":false,\"draft\":false,\"fallback_as_issue\":false,\"if_no_changes\":\"error\",\"labels\":[\"automated-repair\"],\"max\":1,\"max_patch_files\":20,\"max_patch_size\":256,\"patch_format\":\"bundle\",\"protect_top_level_dot_folders\":true,\"protected_files\":[\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\"],\"protected_files_policy\":\"blocked\",\"signed_commits\":false,\"stacked\":false,\"title_prefix\":\"fix(${{ inputs.repair_kind }}): \"},\"missing_data\":{\"max\":1},\"missing_tool\":{\"max\":1},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{\"max\":1},\"update_pull_request\":{\"allow_body\":true,\"allow_title\":true,\"footer\":false,\"max\":1,\"target\":\"${{ inputs.feature_pr_number }}\",\"update_branch\":false,\"update_branch_stacks\":false}}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
