name: "PR Repair"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      base_ref:
        description: Verified current candidate immediate base branch.
        required: true
        type: string
      base_sha:
        description: Exact current candidate immediate base commit, validated separately from comparison_base_sha.
        required: true
        type: string
      comparison_base_sha:
        description: Original feature base commit for the complete feature-plus-repairs diff; equals feature_base_sha.
        required: true
        type: string
      feature_base_ref:
        description: Original feature base branch, outside the repair-only stack.
        required: true
        type: string
      feature_base_sha:
        description: Exact original feature base commit bound to this repair attempt.
        required: true
        type: string
      feature_head_ref:
        description: Original feature head branch; trunk of the controller-managed repair-only stack.
        required: true
        type: string
      feature_head_sha:
        description: Current feature trunk head commit bound to this repair attempt, not the controller's initial_head_sha.
        required: true
        type: string
      feature_metadata_hash:
        description: Lowercase SHA-256 of UTF-8 JSON.stringify([feature title, feature body || '']).
        required: true
        type: string
      feature_pr_number:
        description: Original root feature PR number; never a member of the repair-only native stack.
        required: true
        type: string
      findings:
        description: Combined failed-gate diagnostics, compact and at most 12000 bytes.
        required: true
        type: string
      head_ref:
        description: Verified current candidate head branch; the next repair targets this branch.
        required: true
        type: string
      head_sha:
        description: Exact current candidate head commit assessed by the gates.
        required: true
        type: string
      pr_number:
        description: Current candidate PR number; original feature first, top repair thereafter.
        required: true
        type: string
      repair_kind:
        description: Exactly one repair scope; metadata, lint, build, test, security, or docs.
        required: true
        type: string
    outputs:
      created_pr_number:
        description: Number of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_number }}
      created_pr_url:
        description: URL of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_url }}
    secrets:
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false

permissions: {}

concurrency:
  group: "gh-aw-pr-repair-${{ github.run_id }}"
  queue: max

run-name: "PR Repair"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.pr-repair
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=PR%20Repair,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

