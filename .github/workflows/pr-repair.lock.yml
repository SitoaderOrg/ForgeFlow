          GH_AW_PROMPT_CONTENT_0001: "<safe-output-tools>\nTools: create_pull_request, update_pull_request, missing_tool, missing_data, noop\n"
          GH_AW_PROMPT_CONTENT_0002: "</safe-output-tools>\n"
          GH_AW_PROMPT_CONTENT_0003: "</system>\n"
          GH_AW_PROMPT_CONTENT_0004: "{{#runtime-import .github/workflows/pr-repair.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_INPUTS_BASE_SHA: ${{ inputs.base_sha }}
          GH_AW_INPUTS_COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          GH_AW_INPUTS_FEATURE_BASE_REF: ${{ inputs.feature_base_ref }}
          GH_AW_INPUTS_FEATURE_HEAD_REF: ${{ inputs.feature_head_ref }}
          GH_AW_INPUTS_FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          GH_AW_INPUTS_FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          GH_AW_INPUTS_HEAD_REF: ${{ inputs.head_ref }}
          GH_AW_INPUTS_HEAD_SHA: ${{ inputs.head_sha }}
          GH_AW_INPUTS_PR_NUMBER: ${{ inputs.pr_number }}
          GH_AW_INPUTS_REPAIR_KIND: ${{ inputs.repair_kind }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'interpolate_prompt.cjs'));
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_INPUTS_BASE_SHA: ${{ inputs.base_sha }}
          GH_AW_INPUTS_COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          GH_AW_INPUTS_FEATURE_BASE_REF: ${{ inputs.feature_base_ref }}
          GH_AW_INPUTS_FEATURE_HEAD_REF: ${{ inputs.feature_head_ref }}
          GH_AW_INPUTS_FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          GH_AW_INPUTS_FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          GH_AW_INPUTS_HEAD_REF: ${{ inputs.head_ref }}
          GH_AW_INPUTS_HEAD_SHA: ${{ inputs.head_sha }}
          GH_AW_INPUTS_PR_NUMBER: ${{ inputs.pr_number }}
          GH_AW_INPUTS_REPAIR_KIND: ${{ inputs.repair_kind }}
          GH_AW_MCP_CLI_SERVERS_LIST: '- `safeoutputs` — run `safeoutputs --help` to see available tools'
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require(path.join(actionsDir, 'substitute_placeholders.cjs'));

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_SERVER_URL: process.env.GH_AW_GITHUB_SERVER_URL,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_INPUTS_BASE_SHA: process.env.GH_AW_INPUTS_BASE_SHA,
                GH_AW_INPUTS_COMPARISON_BASE_SHA: process.env.GH_AW_INPUTS_COMPARISON_BASE_SHA,
                GH_AW_INPUTS_FEATURE_BASE_REF: process.env.GH_AW_INPUTS_FEATURE_BASE_REF,
                GH_AW_INPUTS_FEATURE_HEAD_REF: process.env.GH_AW_INPUTS_FEATURE_HEAD_REF,
                GH_AW_INPUTS_FEATURE_HEAD_SHA: process.env.GH_AW_INPUTS_FEATURE_HEAD_SHA,
                GH_AW_INPUTS_FEATURE_PR_NUMBER: process.env.GH_AW_INPUTS_FEATURE_PR_NUMBER,
                GH_AW_INPUTS_HEAD_REF: process.env.GH_AW_INPUTS_HEAD_REF,
                GH_AW_INPUTS_HEAD_SHA: process.env.GH_AW_INPUTS_HEAD_SHA,
                GH_AW_INPUTS_PR_NUMBER: process.env.GH_AW_INPUTS_PR_NUMBER,
                GH_AW_INPUTS_REPAIR_KIND: process.env.GH_AW_INPUTS_REPAIR_KIND,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
      pull-requests: read
    concurrency:
      group: "gh-aw-copilot-remediation-agents"
      queue: max
    timeout-minutes: 20
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: prrepair
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      artifact_prefix: ${{ needs.activation.outputs.artifact_prefix }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@v0.89.21
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "PR Repair"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/pr-repair.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.87"
          GH_AW_INFO_AWF_VERSION: "v0.28.23"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}activation
          path: /tmp/gh-aw
      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh"
        env:
          GH_HOST: github.com
          GH_AW_COMPILED_VERSION: v0.89.21
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.23 --rootless
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - env:
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          EXPECTED_BASE_REF: ${{ inputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_HEAD_REF: ${{ inputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          FEATURE_BASE_REF: ${{ inputs.feature_base_ref }}
          FEATURE_BASE_SHA: ${{ inputs.feature_base_sha }}
          FEATURE_HEAD_REF: ${{ inputs.feature_head_ref }}
          FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          FEATURE_METADATA_HASH: ${{ inputs.feature_metadata_hash }}
          FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          FINDINGS: ${{ inputs.findings }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_KIND: ${{ inputs.repair_kind }}
        id: repair-context
        name: Verify exact repair context and snapshot bounded inputs
        run: "set -euo pipefail\n[[ \"$PR_NUMBER\" =~ ^[1-9][0-9]*$ ]]\n[[ \"$FEATURE_PR_NUMBER\" =~ ^[1-9][0-9]*$ ]]\ncase \"$REPAIR_KIND\" in\n  metadata|lint|build|test|security|docs) ;;\n  *) echo \"::error::Unsupported repair_kind\"; exit 1 ;;\nesac\n[[ \"$EXPECTED_HEAD_SHA\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$EXPECTED_BASE_SHA\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$FEATURE_HEAD_SHA\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$FEATURE_BASE_SHA\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$COMPARISON_BASE_SHA\" == \"$FEATURE_BASE_SHA\" ]]\n[[ \"$FEATURE_METADATA_HASH\" =~ ^[0-9a-f]{64}$ ]]\ngit check-ref-format \"refs/heads/$EXPECTED_HEAD_REF\"\ngit check-ref-format \"refs/heads/$EXPECTED_BASE_REF\"\ngit check-ref-format \"refs/heads/$FEATURE_HEAD_REF\"\ngit check-ref-format \"refs/heads/$FEATURE_BASE_REF\"\n[[ \"$EXPECTED_HEAD_REF\" != \"$EXPECTED_BASE_REF\" ]]\n[[ \"$FEATURE_HEAD_REF\" != \"$FEATURE_BASE_REF\" ]]\n[[ -n \"$FINDINGS\" && \"$(printf %s \"$FINDINGS\" | wc -c)\" -le 12000 ]]\ncd \"$GITHUB_WORKSPACE\"\nfeature=\"$(timeout 30s gh api \"repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR_NUMBER\")\"\nmetadata=\"$(timeout 30s gh api \"repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER\")\"\nFEATURE_SNAPSHOT=\"$feature\" CANDIDATE_SNAPSHOT=\"$metadata\" node <<'NODE'\nconst assert = require('node:assert/strict');\nconst { createHash } = require('node:crypto');\nconst env = process.env;\nconst feature = JSON.parse(env.FEATURE_SNAPSHOT);\nconst candidate = JSON.parse(env.CANDIDATE_SNAPSHOT);\nfor (const [pr, prefix, number] of [\n  [feature, 'FEATURE_', env.FEATURE_PR_NUMBER],\n  [candidate, 'EXPECTED_', env.PR_NUMBER],\n]) {\n  assert.equal(String(pr.number), number, 'Unexpected PR identity');\n  assert.equal(pr.state, 'open', 'PR must remain open');\n  for (const side of ['head', 'base']) {\n    assert.equal(pr[side]?.repo?.full_name, env.GITHUB_REPOSITORY, 'PR must remain in this repository');\n    assert.equal(pr[side]?.ref, env[`${prefix}${side.toUpperCase()}_REF`], 'Stale PR branch');\n    assert.equal(pr[side]?.sha, env[`${prefix}${side.toUpperCase()}_SHA`], 'Stale PR commit');\n  }\n}\nconst metadataHash = pr => createHash('sha256').update(JSON.stringify([pr.title, pr.body || '']), 'utf8').digest('hex');\nassert.equal(metadataHash(feature), env.FEATURE_METADATA_HASH, 'Stale feature metadata');\nif (env.PR_NUMBER === env.FEATURE_PR_NUMBER) {\n  assert.equal(metadataHash(candidate), env.FEATURE_METADATA_HASH, 'Feature metadata changed between snapshot reads');\n}\nassert.equal(env.COMPARISON_BASE_SHA, env.FEATURE_BASE_SHA, 'Comparison must use the original feature base');\nif (env.REPAIR_KIND === 'metadata') {\n  assert.equal(env.PR_NUMBER, env.FEATURE_PR_NUMBER, 'Metadata repairs may only target the original feature PR');\n  for (const field of ['HEAD_REF', 'HEAD_SHA', 'BASE_REF', 'BASE_SHA']) {\n    assert.equal(env[`EXPECTED_${field}`], env[`FEATURE_${field}`], 'Metadata requires the original feature snapshot');\n  }\n}\nNODE\ngit checkout --detach \"$EXPECTED_HEAD_SHA\"\n[[ \"$(git rev-parse HEAD)\" == \"$EXPECTED_HEAD_SHA\" ]]\ngit cat-file -e \"$EXPECTED_BASE_SHA^{commit}\"\ngit cat-file -e \"$COMPARISON_BASE_SHA^{commit}\"\ngit merge-base --is-ancestor \"$FEATURE_HEAD_SHA\" \"$EXPECTED_HEAD_SHA\"\ngit update-ref refs/remotes/origin/pr-head \"$EXPECTED_HEAD_SHA\"\n{\n  printf 'GH_AW_PR_HEAD_BASE_BRANCH=%s\\n' \"$EXPECTED_HEAD_REF\"\n  printf 'GH_AW_PR_HEAD_BASE_SHA=%s\\n' \"$EXPECTED_HEAD_SHA\"\n  printf 'GH_AW_PR_HEAD_BASE_REPO=%s\\n' \"$GITHUB_REPOSITORY\"\n  printf 'GH_AW_PR_HEAD_REPO=%s\\n' \"$GITHUB_REPOSITORY\"\n  printf 'GH_AW_PR_HEAD_BASE_PR_NUMBER=%s\\n' \"$PR_NUMBER\"\n  printf 'GH_AW_PR_HEAD_BASE_REF=refs/remotes/origin/pr-head\\n'\n} >> \"$GITHUB_ENV\"\n# Keep snapshots in Git metadata, outside the publishable worktree.\ncontext_dir=\"$(git rev-parse --absolute-git-dir)/gh-aw-repair\"\nmkdir -p \"$context_dir\"\nprintf '%s\\n' \"$FINDINGS\" > \"$context_dir/findings.txt\"\njq '{number,title,body,head:{ref:.head.ref,sha:.head.sha},base:{ref:.base.ref,sha:.base.sha}}' \\\n  <<< \"$metadata\" > \"$context_dir/pr.json\"\njq '{number,title,body,head:{ref:.head.ref,sha:.head.sha},base:{ref:.base.ref,sha:.base.sha}}' \\\n  <<< \"$feature\" > \"$context_dir/feature.json\"\n[[ \"$(wc -c < \"$context_dir/pr.json\")\" -le 16000 ]]\n[[ \"$(wc -c < \"$context_dir/feature.json\")\" -le 16000 ]]\ngit diff --name-only \"$COMPARISON_BASE_SHA...$EXPECTED_HEAD_SHA\" > \"$context_dir/changed-files.txt\"\n[[ \"$(wc -l < \"$context_dir/changed-files.txt\")\" -le 100 ]]\nprintf 'Repair workspace: %s\\nContext directory: %s\\n' \"$GITHUB_WORKSPACE\" \"$context_dir\""

      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.28.23@sha256:2c78aaba1c108e130e2d6d01e4f2cca334ea04c53e6f258913ac34173fe7e3b2 ghcr.io/github/gh-aw-firewall/api-proxy:0.28.23@sha256:c15c3d1208df10c5b588a3657be53742aa982ae0909d1eb1812525268794ca64 ghcr.io/github/gh-aw-firewall/squid:0.28.23@sha256:02ffc56dd40158223064ef03a78c2d9717473c93723b4e403d455ea6f0b09ae0 ghcr.io/github/gh-aw-mcpg:v0.4.25@sha256:9be0a86220e807a0ecc89e53d7453468f7a53fbc6b3d1efd2299025ffe01d086 ghcr.io/github/gh-aw-node@sha256:11c2c544876cdbaffefe0f7f1283b74838c209654b4934a78e23ed11f750490f
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
