name: PR Human Review Handoff

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      metadata_hash:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Request human review and optionally enable native auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Hand off the validated revision
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          METADATA_HASH: ${{ inputs.metadata_hash }}
          REVIEWERS: ${{ vars.PR_REVIEWERS }}
          ENABLE_AUTO_MERGE: ${{ vars.PR_ENABLE_AUTO_MERGE || 'false' }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const metadataHash = pr => createHash('sha256').update(JSON.stringify([pr.title, pr.body || ''])).digest('hex');
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: number
            });
            if (pr.state !== 'open' || pr.head.ref !== process.env.HEAD_REF ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.head.sha !== process.env.HEAD_SHA || pr.base.ref !== process.env.BASE_REF ||
                pr.base.sha !== process.env.BASE_SHA || metadataHash(pr) !== process.env.METADATA_HASH) {
              throw new Error('PR changed after validation; no review or merge handoff was performed.');
            }
            if (pr.draft) {
              core.notice('Quality checks passed; the draft remains a draft. No auto-merge was enabled.');
              return;
            }
            const reviewers = [...new Set((process.env.REVIEWERS || '').split(',').map(s => s.trim()).filter(Boolean))];
            if (reviewers.includes(pr.user.login)) {
              throw new Error('PR_REVIEWERS includes the PR author, who cannot approve their own PR.');
            }
            const requested = new Set(pr.requested_reviewers.map(user => user.login));
            const missing = reviewers.filter(login => !requested.has(login));
            if (missing.length) {
              await github.rest.pulls.requestReviewers({
                ...context.repo, pull_number: number, reviewers: missing
              });
            }

            let mergeStatus = 'Auto-merge is disabled; a human must approve and merge.';
            if (process.env.ENABLE_AUTO_MERGE === 'true') {
              const { data: repository } = await github.rest.repos.get(context.repo);
              if (!repository.allow_auto_merge) {
                throw new Error('Enable repository auto-merge before setting PR_ENABLE_AUTO_MERGE=true.');
              }
              const rules = await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                ...context.repo, branch: pr.base.ref, per_page: 100
              });
              const approval = rules.find(rule => rule.type === 'pull_request' &&
                rule.parameters?.required_approving_review_count >= 1 &&
                rule.parameters.dismiss_stale_reviews_on_push &&
                rule.parameters.require_last_push_approval);
              const checks = rules.find(rule => rule.type === 'required_status_checks' &&
                rule.parameters?.strict_required_status_checks_policy &&
                rule.parameters.required_status_checks.some(check => check.context === 'PR Quality / Ready for review'));
              if (!approval || !checks) {
                throw new Error('Auto-merge requires active branch rules for fresh human approval and the current PR Quality / Ready for review check. See prereqs.md.');
              }
              for (const id of new Set([approval.ruleset_id, checks.ruleset_id])) {
                const { data: ruleset } = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
                  ...context.repo, ruleset_id: id
                });
                if (ruleset.enforcement !== 'active' || !Array.isArray(ruleset.bypass_actors) || ruleset.bypass_actors.length) {
                  throw new Error('Required review/check rules must be active with no bypass actors.');
                }
              }
              const { data: latest } = await github.rest.pulls.get({
                ...context.repo, pull_number: number
              });
              if (latest.head.sha !== process.env.HEAD_SHA || latest.head.ref !== pr.head.ref ||
                  latest.base.sha !== pr.base.sha || latest.base.ref !== pr.base.ref ||
                  latest.state !== 'open' || latest.draft || metadataHash(latest) !== process.env.METADATA_HASH) {
                throw new Error('PR changed while checking merge policy; auto-merge was not enabled.');
              }
              if (!latest.auto_merge) {
                await github.graphql(
                  'mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }',
                  { id: latest.node_id }
                );
              }
              mergeStatus = 'Native auto-merge is enabled. GitHub will wait for required checks and human approval.';
            }
            await core.summary.addRaw(
              `Validated revision: ${pr.head.sha}\n\n` +
              (reviewers.length ? `Human reviewers: ${reviewers.join(', ')}.\n\n` : 'No explicit reviewers configured; use CODEOWNERS or request a human reviewer.\n\n') +
              mergeStatus
            ).write();
