name: PR Security Gatekeeper

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
    outputs:
      findings:
        description: Security findings, limited to 6000 characters.
        value: ${{ jobs.security-gatekeeper.outputs.findings }}
      codeql_result:
        description: Native CodeQL job result for status display.
        value: ${{ jobs.security-gatekeeper.outputs.codeql_result }}
      dependency_result:
        description: Native dependency-review job result for status display.
        value: ${{ jobs.security-gatekeeper.outputs.dependency_result }}
      secret_result:
        description: Native secret-scanning job result for status display.
        value: ${{ jobs.security-gatekeeper.outputs.secret_result }}

permissions:
  contents: read

jobs:
  codeql-analysis:
    name: JavaScript & TypeScript CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL reads workflow metadata even when SARIF uploads are disabled.
      actions: read
      security-events: read
    outputs:
      findings: ${{ steps.policy.outputs.findings }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage

      - name: Analyze CodeQL
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: never

      - name: Check CodeQL Security Severity
        id: policy
        if: always()
        uses: actions/github-script@v7
        env:
          ANALYSIS_RESULT: ${{ steps.analyze.outcome }}
          MIN_SECURITY_SEVERITY: ${{ vars.CODEQL_MIN_SECURITY_SEVERITY || '4.0' }}
        with:
          script: |
            const fs = require('fs');
            const messages = [];
            try {
              if (process.env.ANALYSIS_RESULT !== 'success') throw new Error('CodeQL analysis did not complete successfully.');
              const minimum = Number(process.env.MIN_SECURITY_SEVERITY);
              if (!process.env.MIN_SECURITY_SEVERITY.trim() || !Number.isFinite(minimum) || minimum < 0 || minimum > 10) {
                throw new Error('Security severity threshold must be a number between 0 and 10.');
              }
              const files = fs.readdirSync('sarif-results').filter(name => name.endsWith('.sarif')).sort();
              if (!files.length) throw new Error('CodeQL produced no SARIF files.');
              for (const file of files) {
                const sarif = JSON.parse(fs.readFileSync(`sarif-results/${file}`, 'utf8'));
                if (sarif.version !== '2.1.0' || !Array.isArray(sarif.runs) || !sarif.runs.length) {
                  throw new Error(`${file}: invalid SARIF document.`);
                }
                for (const run of sarif.runs) {
                  const driver = run.tool?.driver;
                  if (driver?.name !== 'CodeQL' || !Array.isArray(driver.rules) || !Array.isArray(run.results)) {
                    throw new Error(`${file}: missing CodeQL rules or results.`);
                  }
                  if (run.invocations !== undefined && (!Array.isArray(run.invocations) || run.invocations.some(invocation =>
                    invocation?.executionSuccessful !== true ||
                    (invocation.toolExecutionNotifications ?? []).some(note => note.level === 'error')))) {
                    throw new Error(`${file}: failed or invalid CodeQL invocation.`);
                  }
                  const rules = new Map();
                  for (const rule of driver.rules) {
                    if (typeof rule.id !== 'string' || !rule.id || rules.has(rule.id)) throw new Error(`${file}: invalid or duplicate rule ID.`);
                    rules.set(rule.id, rule);
                  }
                  for (const result of run.results) {
                    const rule = result.ruleId !== undefined ? rules.get(result.ruleId) :
                      (Number.isInteger(result.ruleIndex) && result.ruleIndex >= 0 ? driver.rules[result.ruleIndex] : undefined);
                    if (result.ruleIndex !== undefined && (!Number.isInteger(result.ruleIndex) || result.ruleIndex < 0 ||
                        driver.rules[result.ruleIndex] !== rule)) throw new Error(`${file}: invalid result rule index.`);
                    const raw = rule?.properties?.['security-severity'];
                    const severity = Number(raw);
                    if (!rule || !['string', 'number'].includes(typeof raw) || String(raw).trim() === '' ||
                        !Number.isFinite(severity) || severity < 0 || severity > 10) {
                      throw new Error(`${file}: missing or invalid security-severity for ${result.ruleId ?? result.ruleIndex}.`);
                    }
                    const message = result.message?.text || result.message?.markdown;
                    if (typeof message !== 'string' || !message.trim()) throw new Error(`${file}: missing result message.`);
                    if (severity >= minimum) {
                      const location = result.locations?.[0]?.physicalLocation;
                      messages.push(`[${rule.id}] severity ${severity}: ${message.replace(/\s+/g, ' ')} ` +
                        `(${location?.artifactLocation?.uri ?? 'location unavailable'}:${location?.region?.startLine ?? '?'})`);
                    }
                  }
                }
              }
            } catch (error) {
              messages.push(`CodeQL validation failed: ${error.message}`);
            }
            core.setOutput('findings', (messages.join('\n') || 'CodeQL: valid SARIF; no findings at or above the configured severity.').slice(0, 3500));
            if (messages.length) core.setFailed('CodeQL security policy failed; see findings.');

  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.findings.outputs.findings }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Review Dependency Changes
        id: review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ inputs.base_sha }}
          head-ref: ${{ inputs.head_sha }}
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never

      - name: Publish Dependency Findings
        id: findings
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_RESULT: ${{ steps.review.outcome }}
          DETAILS: ${{ steps.review.outputs.comment-content }}
        with:
          script: |
            core.setOutput('findings', (`Dependency review: ${process.env.REVIEW_RESULT} (high severity threshold).\n` +
              (process.env.DETAILS || 'See dependency-review logs for advisory or dependency-graph errors.')).slice(0, 1500));

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Scan Checked-Out Files for Secrets
        uses: super-linter/super-linter/slim@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        env:
          RUN_LOCAL: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_GITLEAKS: true

  security-gatekeeper:
    name: Security Gatekeeper Status
    needs: [codeql-analysis, dependency-review, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.summary.outputs.findings }}
      codeql_result: ${{ steps.summary.outputs.codeql_result }}
      dependency_result: ${{ steps.summary.outputs.dependency_result }}
      secret_result: ${{ steps.summary.outputs.secret_result }}
    steps:
      - name: Summarize Native Security Results
        id: summary
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          CODEQL_RESULT: ${{ needs.codeql-analysis.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_FINDINGS: ${{ needs.codeql-analysis.outputs.findings }}
          DEPENDENCY_FINDINGS: ${{ needs.dependency-review.outputs.findings }}
        with:
          script: |
            const results = {
              codeql_result: process.env.CODEQL_RESULT,
              dependency_result: process.env.DEPENDENCY_RESULT,
              secret_result: process.env.SECRET_RESULT
            };
            for (const [name, result] of Object.entries(results)) core.setOutput(name, result);
            const text = [
              `Security at ${process.env.HEAD_SHA}`,
              ...Object.entries(results).map(([name, result]) => `${name}: ${result}`),
              process.env.CODEQL_FINDINGS || 'CodeQL diagnostics unavailable; inspect the native job logs.',
              process.env.DEPENDENCY_FINDINGS || 'Dependency diagnostics unavailable; inspect the native job logs.',
              process.env.SECRET_RESULT === 'success' ? 'Gitleaks: checked-out files passed secret detection.' :
                'Gitleaks did not pass; inspect its logs for affected paths. Do not copy secret values into repair findings.',
              'Secret detection covers this checkout, not historical exposure or GitHub secret-scanning alerts; exposed credentials still require revocation.'
            ].join('\n').slice(0, 6000);
            core.setOutput('findings', text);
            await core.summary.addRaw(text + '\n').write();
            if (Object.values(results).some(result => result !== 'success')) {
              core.setFailed('Every required security job must succeed.');
            }
