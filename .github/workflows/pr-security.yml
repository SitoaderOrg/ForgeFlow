name: PR Security Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  detect-environment:
    name: Detect Languages & Manifests
    runs-on: ubuntu-latest
    outputs:
      has_codeql_languages: ${{ steps.check.outputs.has_codeql_languages }}
      has_dependencies: ${{ steps.check.outputs.has_dependencies }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Supported Files
        id: check
        run: |
          # Check for CodeQL supported languages (js/ts, python, go, java, c#, ruby, c/c++, swift)
          if git ls-files | grep -E '\.(js|jsx|ts|tsx|mjs|cjs|py|go|java|kt|cs|rb|c|cpp|cc|cxx|h|hpp|swift)$' > /dev/null; then
            echo "has_codeql_languages=true" >> $GITHUB_OUTPUT
          else
            echo "has_codeql_languages=false" >> $GITHUB_OUTPUT
          fi

          # Check for dependency manifests across package ecosystems
          if git ls-files | grep -E '(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements\.txt|Pipfile\.lock|poetry\.lock|go\.mod|pom\.xml|build\.gradle|Cargo\.lock|Gemfile\.lock|composer\.lock)' > /dev/null; then
            echo "has_dependencies=true" >> $GITHUB_OUTPUT
          else
            echo "has_dependencies=false" >> $GITHUB_OUTPUT
          fi

  dependency-review:
    name: GitHub Dependency Review
    needs: detect-environment
    if: needs.detect-environment.outputs.has_dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql-analysis:
    name: GitHub CodeQL SAST
    needs: detect-environment
    if: needs.detect-environment.outputs.has_codeql_languages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:auto"

  security-gatekeeper:
    name: Security Gatekeeper Status
    needs: [detect-environment, dependency-review, codeql-analysis]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Security Results & Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);

            const depReviewResult = "${{ needs.dependency-review.result }}";
            const codeqlResult = "${{ needs.codeql-analysis.result }}";

            const hasFailure = depReviewResult === 'failure' || codeqlResult === 'failure';

            if (hasFailure) {
              if (!existingLabels.includes('security-alert')) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    labels: ['security-alert']
                  });
                  core.info("Applied 'security-alert' label to trigger pr-security-fixer workflow.");
                } catch (e) {
                  core.warning(`Failed to add security-alert label: ${e.message}`);
                }
              }

              let summary = '### ❌ Security Gatekeeper Failed\n\n' +
                '> 🛡️ **Autonomous Remediation**: Added `security-alert` label. The **PR Security Fixer** workflow will analyze the GitHub Code Security findings (CodeQL SAST or Dependency Review), remediate vulnerabilities or update manifests, and push fixes to your branch.\n\n' +
                `- **Dependency Review**: ${depReviewResult}\n` +
                `- **CodeQL SAST**: ${codeqlResult}\n`;
              await core.summary.addRaw(summary).write();
              core.setFailed('Security vulnerabilities or insecure dependencies detected.');
            } else {
              if (existingLabels.includes('security-alert')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    name: 'security-alert'
                  });
                  core.info("Removed 'security-alert' label as all security checks passed.");
                } catch (e) {
                  core.warning(`Failed to remove security-alert label: ${e.message}`);
                }
              }

              let summary = '### ✅ Security Gatekeeper Passed\n\n' +
                'All GitHub Code Security checks passed successfully.\n';
              await core.summary.addRaw(summary).write();
            }
