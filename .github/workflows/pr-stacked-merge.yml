name: PR Stacked Remediation Auto-Merger

# Remediation relay (the "Recheck" step of Check -> Repair -> Recheck -> Review & merge).
#
# Agents run with the default GITHUB_TOKEN, and GitHub never starts workflow runs for
# PRs/pushes/labels created with that token (nor `workflow_run` events for runs that
# were themselves dispatched with it). Every gh-aw agent therefore dispatches this
# workflow through its `dispatch-workflow` safe output, after its other safe outputs. The relay:
#   1. squash-merges open stacked remediation PRs into the parent branch;
#   2. re-checks only the gate(s) the agent repaired on the new commit, carrying the other
#      gate results over, so agents working in parallel never wait for each other;
#   3. updates the `pr-quality` verdict (one final full check runs once every gate passed).
# It never clears gate labels or marks anything as fixed: only the gates do that.

run-name: Remediation relay for ${{ inputs.branch || github.event.pull_request.base.ref }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Parent PR head branch to consolidate'
        required: true
        type: string
      agent_result:
        description: 'Result of the dispatching agent job (success, failure, cancelled, skipped)'
        required: false
        type: string
        default: ''
      source:
        description: 'Workflow run that dispatched the relay'
        required: false
        type: string
        default: ''
  # Still honoured when stacked PRs are opened with a PAT (GH_AW_CI_TRIGGER_TOKEN)
  pull_request:
    types: [opened, reopened, labeled]
concurrency:
  group: pr-stacked-merge-${{ inputs.branch || github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

jobs:
  auto-merge-stacked:
    name: Auto-Merge Remediation PRs & Recheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'lint-remediation') ||
      contains(github.event.pull_request.labels.*.name, 'test-remediation') ||
      contains(github.event.pull_request.labels.*.name, 'security-remediation') ||
      contains(github.event.pull_request.labels.*.name, 'doc-remediation')

    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Consolidate Stacked PRs & Recheck
        uses: actions/github-script@v7
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          AGENT_RESULT: ${{ inputs.agent_result }}
          SOURCE: ${{ inputs.source }}
          PIPELINE_WAIT_MINUTES: ${{ vars.PIPELINE_WAIT_MINUTES || '30' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const quality = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-quality.cjs`);
            const REMEDIATION_LABELS = ['lint-remediation', 'test-remediation', 'security-remediation', 'doc-remediation'];
            const ACTIVE = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const summary = (text) => core.summary.addRaw(`### Remediation Relay\n\n${text}\n`).write();

            const parentBranch = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.ref
              : process.env.INPUT_BRANCH;

            if (!parentBranch || parentBranch === defaultBranch) {
              core.info(`Nothing to consolidate for branch '${parentBranch}'.`);
              return;
            }

            const [parent] = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${parentBranch}`, per_page: 10
            });
            if (!parent) {
              core.info(`No open parent PR found for branch '${parentBranch}'.`);
              return;
            }
            core.info(`Parent PR: #${parent.number} (${parent.html_url})`);
            const headBefore = parent.head.sha;

            // Gates to re-check: the one the dispatching agent repairs, plus one per merged stacked PR.
            const repaired = new Set();
            const sourceGate = quality.repairedGate(process.env.SOURCE);
            if (sourceGate) repaired.add(sourceGate);

            // 1. Merge every open stacked remediation PR that targets the parent branch.
            //    Gate labels stay on the parent PR: only a passing gate removes them.
            const stacked = (await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: parentBranch, per_page: 100
            })).filter(p => p.labels.some(l => REMEDIATION_LABELS.includes(l.name)));

            let merged = 0;
            for (const pr of stacked) {
              try {
                if (pr.draft) {
                  await github.graphql(
                    'mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { clientMutationId } }',
                    { id: pr.node_id }
                  );
                  core.info(`Marked stacked PR #${pr.number} ready for review.`);
                }

                const { data: result } = await github.rest.pulls.merge({
                  owner, repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `Merge stacked PR #${pr.number}: ${pr.title}`
                });
                merged++;
                const gates = pr.labels.map(l => quality.repairedGate(l.name)).filter(Boolean);
                gates.forEach(g => repaired.add(g));
                const gateNames = gates.map(g => quality.GATES.find(x => x.id === g).name).join(', ') || 'affected';
                core.info(`✅ Merged stacked PR #${pr.number} into '${parentBranch}' (${result.sha}).`);

                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                } catch (e) {
                  core.warning(`Could not delete branch '${pr.head.ref}': ${e.message}`);
                }

                const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${result.sha}`;
                await github.rest.issues.createComment({
                  owner, repo, issue_number: parent.number,
                  body: [
                    '### 🤖 Autonomous Remediation Auto-Merged',
                    '',
                    'A remediation agent proposed a fix that has been squashed into your branch:',
                    '',
                    `- **Stacked PR**: [#${pr.number} - ${pr.title}](${pr.html_url})`,
                    `- **Merged Commit**: [\`${result.sha.slice(0, 7)}\`](${commitUrl})`,
                    `- **Target Branch**: \`${parentBranch}\``,
                    '',
                    `> 💡 *The fix is not trusted until the gates pass: the **${gateNames}** gate re-checks this commit now, and every gate runs once more together before human review.*`
                  ].join('\n')
                });
              } catch (e) {
                core.warning(`Failed to merge stacked PR #${pr.number}: ${e.message}`);
                // A human has to resolve it: stop counting it as repair in progress.
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [quality.BLOCKED_LABEL]
                }).catch(err => core.warning(`Could not label stacked PR #${pr.number}: ${err.message}`));
                await github.rest.issues.createComment({
                  owner, repo, issue_number: parent.number,
                  body: `### ⚠️ Stacked remediation PR #${pr.number} could not be auto-merged\n\n${e.message}\n\nPlease review and merge it manually.`
                });
              }
            }

            // 2. A pipeline still running on this branch is about to record fresh gate results.
            const deadline = Date.now() + Number(process.env.PIPELINE_WAIT_MINUTES) * 60000;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'pr-pipeline.yml', branch: parentBranch, per_page: 20
              });
              const running = data.workflow_runs.filter(r => ACTIVE.has(r.status));
              if (!running.length) break;
              if (Date.now() > deadline) {
                core.warning(`PR Quality Pipeline still running after ${process.env.PIPELINE_WAIT_MINUTES} minutes; deciding anyway.`);
                break;
              }
              core.info(`Waiting for PR Quality Pipeline run(s) ${running.map(r => r.id).join(', ')} to finish...`);
              await sleep(30000);
            }

            // 3. Re-check only the repaired gates on the new head commit; every other gate keeps
            //    its result from the commit before the repair (marked as carried over).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: parent.number });
            const reason = process.env.SOURCE || (merged ? `stacked PR merge` : 'remediation');
            const plan = await quality.recheckGates({
              github, context, core,
              prNumber: parent.number,
              branch: parentBranch,
              before: headBefore,
              sha: pr.head.sha,
              repaired: [...repaired],
              reason
            });

            // 4. Publish the verdict. It stays pending while gates re-check or agents still repair,
            //    and asks for one final full check once every gate passed.
            const verdict = await quality.evaluateVerdict({ github, context, core, prNumber: parent.number });
            const gateNames = (ids) => ids.map(id => quality.GATES.find(g => g.id === id).name).join(', ') || 'none';
            await summary([
              `- Parent PR: #${parent.number}`,
              `- Stacked PRs merged: ${merged}`,
              `- Repaired by: ${process.env.SOURCE || 'stacked PR'}${process.env.AGENT_RESULT ? ` (${process.env.AGENT_RESULT})` : ''}`,
              `- Re-checking: ${gateNames(plan.recheck)}`,
              `- Carried over: ${gateNames(plan.carried)}`,
              `- pr-quality: **${verdict.state}** — ${verdict.summary}`
            ].join('\n'));