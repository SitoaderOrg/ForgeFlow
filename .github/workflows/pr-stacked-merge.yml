name: PR Stacked Remediation Auto-Merger

# Remediation relay: consolidates agent work into the parent PR branch and re-runs the
# PR Quality Pipeline.
#
# Agents run with the default GITHUB_TOKEN, and GitHub never starts workflow runs for
# PRs/pushes/labels created with that token (nor `workflow_run` events for runs that
# were themselves dispatched with it). Every gh-aw agent therefore dispatches this
# workflow from its `conclusion` job once its safe outputs are applied.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Parent PR head branch to consolidate'
        required: true
        type: string
      agent_result:
        description: 'Result of the dispatching agent job (success, failure, cancelled, skipped)'
        required: false
        type: string
        default: ''
      source:
        description: 'Workflow run that dispatched the relay'
        required: false
        type: string
        default: ''
  # Still honoured when stacked PRs are opened with a PAT (GH_AW_CI_TRIGGER_TOKEN)
  pull_request:
    types: [opened, reopened, labeled]
concurrency:
  group: pr-stacked-merge-${{ inputs.branch || github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  auto-merge-stacked:
    name: Auto-Merge Remediation PRs & Re-run Pipeline
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'test-remediation') ||
      contains(github.event.pull_request.labels.*.name, 'security-remediation') ||
      contains(github.event.pull_request.labels.*.name, 'doc-remediation')

    steps:
      - name: Consolidate Stacked PRs & Re-dispatch Pipeline
        uses: actions/github-script@v7
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          AGENT_RESULT: ${{ inputs.agent_result }}
          SOURCE: ${{ inputs.source }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const REMEDIATION = {
              'test-remediation': ['test-required'],
              'doc-remediation': ['docs-required'],
              'security-remediation': ['codeql-alert', 'dependency-alert', 'secret-alert']
            };

            let parentBranch;
            if (context.eventName === 'pull_request') {
              parentBranch = context.payload.pull_request.base.ref;
            } else {
              parentBranch = process.env.INPUT_BRANCH;
            }

            if (!parentBranch || parentBranch === defaultBranch) {
              core.info(`Nothing to consolidate for branch '${parentBranch}'.`);
              return;
            }

            const [parent] = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${parentBranch}`, per_page: 10
            });
            if (!parent) {
              core.info(`No open parent PR found for branch '${parentBranch}'.`);
              return;
            }
            core.info(`Parent PR: #${parent.number} (${parent.html_url})`);

            // 1. Merge every open stacked remediation PR that targets the parent branch
            const stacked = (await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: parentBranch, per_page: 100
            })).filter(p => p.labels.some(l => REMEDIATION[l.name]));

            let merged = 0;
            for (const pr of stacked) {
              try {
                if (pr.draft) {
                  await github.graphql(
                    'mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { clientMutationId } }',
                    { id: pr.node_id }
                  );
                  core.info(`Marked stacked PR #${pr.number} ready for review.`);
                }

                const { data: result } = await github.rest.pulls.merge({
                  owner, repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `Merge stacked PR #${pr.number}: ${pr.title}`
                });
                merged++;
                core.info(`✅ Merged stacked PR #${pr.number} into '${parentBranch}' (${result.sha}).`);

                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                } catch (e) {
                  core.warning(`Could not delete branch '${pr.head.ref}': ${e.message}`);
                }

                for (const label of pr.labels.flatMap(l => REMEDIATION[l.name] || [])) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: parent.number, name: label });
                  } catch (e) {
                    if (e.status !== 404) core.warning(`Could not remove '${label}': ${e.message}`);
                  }
                }

                const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${result.sha}`;
                await github.rest.issues.createComment({
                  owner, repo, issue_number: parent.number,
                  body: [
                    '### 🤖 Autonomous Remediation Auto-Merged',
                    '',
                    'The remediation agent has automatically incorporated verified improvements into your branch:',
                    '',
                    `- **Stacked PR**: [#${pr.number} - ${pr.title}](${pr.html_url})`,
                    `- **Merged Commit**: [\`${result.sha.slice(0, 7)}\`](${commitUrl})`,
                    `- **Target Branch**: \`${parentBranch}\``,
                    '',
                    '> 💡 *All changes are squashed directly into your feature branch. The PR Quality Pipeline has been re-run on the updated branch.*'
                  ].join('\n')
                });
              } catch (e) {
                core.warning(`Failed to merge stacked PR #${pr.number}: ${e.message}`);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: parent.number,
                  body: `### ⚠️ Stacked remediation PR #${pr.number} could not be auto-merged\n\n${e.message}\n\nPlease review and merge it manually.`
                });
              }
            }

            // 2. Re-run the PR Quality Pipeline on the (possibly updated) parent branch.
            //    Agents that push directly (lint fixer) or edit metadata (validation) also
            //    rely on this, because GITHUB_TOKEN pushes never raise `synchronize`.
            // Re-run only when there is something new to validate. If the agent itself failed
            // (e.g. inference quota/rate limit), stop here instead of looping; a human can re-run.
            const agentResult = process.env.AGENT_RESULT || '';
            const agentFailed = context.eventName === 'workflow_dispatch' && ['failure', 'cancelled'].includes(agentResult);
            const shouldRerun = merged > 0 || (context.eventName === 'workflow_dispatch' && !agentFailed);
            if (agentFailed && merged === 0) {
              core.warning(`${process.env.SOURCE} finished with '${agentResult}'; not re-running the pipeline.`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: parent.number,
                body: [
                  `### ⚠️ Remediation agent did not complete`,
                  '',
                  `\`${process.env.SOURCE}\` finished with **${agentResult}**, so the pipeline was not re-run automatically.`,
                  '',
                  `Re-run it once the cause is resolved: \`gh workflow run pr-pipeline.yml --ref ${parentBranch} -f pr_number=${parent.number}\``
                ].join('\n')
              });
            }
            if (shouldRerun) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'pr-pipeline.yml',
                ref: parentBranch,
                inputs: { pr_number: String(parent.number) }
              });
              core.info(`🔁 Re-dispatched PR Quality Pipeline for PR #${parent.number} on '${parentBranch}'.`);
            }

            await core.summary.addRaw(
              `### Stacked Remediation Consolidation\n\n- Parent PR: #${parent.number}\n- Stacked PRs merged: ${merged}\n- Pipeline re-dispatched: ${shouldRerun}\n`
            ).write();
