name: PR Tests & Coverage Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Test Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect & Execute Tests
        id: run-tests
        run: |
          TESTS_FOUND=false

          # 1. Node.js / TypeScript (npm / yarn / pnpm)
          if [ -f "package.json" ]; then
            if grep -q '"test"' package.json; then
              TESTS_FOUND=true
              echo "📦 Detected Node.js project with test script. Running npm test..."
              npm ci 2>/dev/null || npm install --prefer-offline --no-audit
              npm test
            fi
          fi

          # 2. Python (pytest / unittest)
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            if find . -maxdepth 3 -name "*test*.py" | grep -q .; then
              TESTS_FOUND=true
              echo "🐍 Detected Python project with tests. Running pytest..."
              pip install pytest pytest-cov 2>/dev/null || true
              pytest --maxfail=5 || python -m unittest discover
            fi
          fi

          # 3. Go (go test)
          if [ -f "go.mod" ] || ls *.go 1>/dev/null 2>&1; then
            if find . -maxdepth 3 -name "*_test.go" | grep -q .; then
              TESTS_FOUND=true
              echo "🐹 Detected Go project with tests. Running go test..."
              go test -v -cover ./...
            fi
          fi

          # 4. Rust (cargo test)
          if [ -f "Cargo.toml" ]; then
            TESTS_FOUND=true
            echo "🦀 Detected Rust project. Running cargo test..."
            cargo test
          fi

          if [ "$TESTS_FOUND" = "false" ]; then
            echo "ℹ️ No test suite or test manifests detected for this codebase. Skipping test gate cleanly."
          fi

      - name: Handle Test Failure (Trigger Autonomous Remediation)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);

            if (!existingLabels.includes('test-required')) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['test-required']
                });
                core.info("Applied 'test-required' label to trigger pr-test-generator workflow.");
              } catch (e) {
                core.warning(`Failed to add test-required label: ${e.message}`);
              }
            }

            let summary = '### ❌ PR Tests & Coverage Gatekeeper Failed\n\n' +
              '> 🧪 **Autonomous Remediation**: Added `test-required` label. The **PR Test Generator** agentic workflow will analyze your PR diff, identify failing or missing unit tests, and open a **Stacked Pull Request** targeting your branch with comprehensive test coverage.\n';
            await core.summary.addRaw(summary).write();
            core.setFailed('Test suite execution failed or tests are missing.');

      - name: Handle Test Success (Clear Remediation Label)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const existingLabels = (context.payload.pull_request.labels || []).map(l => l.name);

            if (existingLabels.includes('test-required')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'test-required'
                });
                core.info("Removed 'test-required' label as all tests passed.");
              } catch (e) {
                core.warning(`Failed to remove test-required label: ${e.message}`);
              }
            }

            let summary = '### ✅ PR Tests & Coverage Gatekeeper Passed\n\n' +
              'All test suites executed and passed successfully.\n';
            await core.summary.addRaw(summary).write();
