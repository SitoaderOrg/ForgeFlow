name: 'Review: Copilot intake'
run-name: 'Review: Copilot intake · PR #${{ github.event.pull_request.number || inputs.pr_number }}'

# Hands a Copilot code review to the review-comments fixer as soon as it is submitted: all of its open
# comments in one batch, addressed in one stacked PR (see .github/scripts/review.cjs). One
# automatic round per PR, and only once every gate passed on the head commit; later reviews are
# left to the author. The review-request workflow (a review that arrived before the gates passed) and
# the pr-quality watchdog (a lost event) hand reviews over the same way.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: string

concurrency:
  group: review-intake-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write
  statuses: write

jobs:
  intake:
    name: Address the Copilot review
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.user.type == 'Bot' && contains(github.event.review.user.login, 'copilot'))
    steps:
      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Hand the review to the review-comments fixer
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const review = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review.cjs`);
            const { result, comments } = await review.addressCopilotReview({
              github, context, core, prNumber: Number(process.env.PR_NUMBER)
            });
            await core.summary.addRaw(`### Copilot review intake\n\n- PR: #${process.env.PR_NUMBER}\n- Result: ${result}${comments ? ` (${comments} comment(s))` : ''}\n`).write();
