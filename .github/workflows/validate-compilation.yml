name: Validate Workflow Compilation

on:
  push:
    paths:
      - '.github/workflows/*.md'
  pull_request:
    paths:
      - '.github/workflows/*.md'

permissions:
  contents: read

jobs:
  validate-compilation:
    name: Verify Lockfile Freshness & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gh-aw extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw || curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> $GITHUB_PATH

      - name: Recompile and validate workflows
        run: gh aw compile --validate

      - name: Check for uncommitted lockfile drift
        run: |
          if ! git diff --exit-code .github/workflows/*.lock.yml; then
            echo "::error::Agentic workflow lockfile is out of date or desynchronized from its markdown source."
            echo "::notice::Run 'gh aw compile' locally and commit the updated *.lock.yml file."
            exit 1
          fi
